site_name: 半導體製程技術
site_description: 依晶圓製造流程編排的半導體製程教科書，每日新增章節並補充產業最新進展
site_url: https://bkhotey4.github.io/semi-knowledge/
repo_url: https://github.com/bkhotey4/semi-knowledge
repo_name: semi-knowledge
copyright: 內容由 AI 依課綱撰寫，僅供學習參考
theme:
  name: material
  language: zh-TW
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切換深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切換淺色模式
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/katex.js
  - javascripts/interactive.js
  - javascripts/games.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/interactive.css
nav:
  - 首頁: index.md
  - 第一篇　半導體物理與元件基礎:
    - 第 1 章　半導體材料與能帶理論: part-01/01-01.md
    - 第 2 章　載子、摻雜與傳輸: part-01/01-02.md
    - 第 3 章　PN 接面與二極體: part-01/01-03.md
  - 第九篇　晶圓廠自動化與 IT/OT:
    - 第 54 章　從機台到工程師：資料流全貌: part-09/09-12.md
  - 第十篇　廠務與廠區設施:
    - 第 55 章　廠務系統總覽與無塵室: part-13/13-01.md
  - 互動學習:
    - 圖卡庫: cards.md
    - 設備機台圖鑑: equipment.md
    - 設備機型圖鑑: models.md
    - 機台到工程師的資料流: dataflow.md
    - 互動實驗室: labs.md
    - 術語閃卡: flashcards.md
  - 遊戲學習:
    - 每日挑戰與成就徽章: daily.md
    - PE 值班模擬: pe-oncall.md
    - 晶圓的一生: wafer-life.md
    - 製程排序拼圖: puzzles.md
  - 術語表: glossary.md
