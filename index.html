<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>半導體知識庫</title>
<meta name="description" content="每日半導體製程、設備與前沿技術知識整理">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --text: #1b1f27; --muted: #5d6675;
    --border: #e2e5ea; --accent: #0b6bcb; --accent-soft: #e6f0fb; --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --surface: #171b23; --text: #e6e9ef; --muted: #99a2b1;
      --border: #2a303b; --accent: #5aa9f5; --accent-soft: #1b2a3c; --code: #1f2430;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --surface: #171b23; --text: #e6e9ef; --muted: #99a2b1;
    --border: #2a303b; --accent: #5aa9f5; --accent-soft: #1b2a3c; --code: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.75 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  header { border-bottom: 1px solid var(--border); background: var(--surface); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: baseline; gap: 12px; padding-top: 18px; padding-bottom: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  header h1 a { color: inherit; text-decoration: none; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 0 4px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .list { list-style: none; padding: 0; margin: 12px 0 40px; display: grid; gap: 10px; }
  .list a {
    display: block; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: inherit; text-decoration: none;
  }
  .list a:hover { border-color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .tag { color: var(--accent); font-weight: 600; margin-right: 8px; }
  .list .title { font-weight: 600; margin-top: 2px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  article { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin: 16px 0 48px; overflow-wrap: anywhere; }
  .back { display: inline-block; margin-top: 16px; color: var(--accent); text-decoration: none; font-size: 14px; }
  article h1, article h2, article h3 { line-height: 1.4; }
  article h3 { margin-top: 1.8em; padding-top: .6em; border-top: 1px solid var(--border); }
  article img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 12px 0; }
  article table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; margin: 12px 0; }
  article th, article td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  article th { background: var(--code); }
  article code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  article pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  article pre code { padding: 0; }
  article blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
  article a { color: var(--accent); }
  @media (max-width: 600px) { article { padding: 16px; } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1><a href="#/">半導體知識庫</a></h1>
  <p>製程 · 設備 · 先進封裝 · 晶圓廠 IT 架構，每日自動更新</p>
</div></header>
<main class="wrap" id="app"></main>
<script>
const app = document.getElementById("app");
let entries = [];
let filter = "all";

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderList() {
  document.title = "半導體知識庫";
  const kinds = [...new Map(entries.map(e => [e.kind, e.label])).entries()];
  const chips = [["all", "全部"], ...kinds].map(([k, l]) =>
    `<button class="chip" data-k="${esc(k)}" aria-pressed="${filter === k}">${esc(l)}</button>`).join("");
  const shown = entries.filter(e => filter === "all" || e.kind === filter);
  const items = shown.map(e => `<li><a href="#/${encodeURIComponent(e.slug)}">
      <div class="meta"><span class="tag">${esc(e.label)}</span>${esc(e.date)}</div>
      <div class="title">${esc(e.title)}</div></a></li>`).join("");
  app.innerHTML = `<div class="filters">${chips}</div>` +
    (items ? `<ul class="list">${items}</ul>` : `<div class="empty">還沒有報告，Bot 下次產生報告後會出現在這裡。</div>`);
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.k; renderList(); });
}

async function renderReport(slug) {
  const e = entries.find(x => x.slug === slug);
  app.innerHTML = `<a class="back" href="#/">← 返回列表</a><article>載入中…</article>`;
  try {
    const res = await fetch(`reports/${encodeURIComponent(slug)}.md`, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    app.querySelector("article").innerHTML =
      (e ? `<div class="meta"><span class="tag">${esc(e.label)}</span>${esc(e.date)}</div>` : "") +
      DOMPurify.sanitize(marked.parse(md));
    document.title = (e ? e.title + " · " : "") + "半導體知識庫";
    window.scrollTo(0, 0);
  } catch (err) {
    app.querySelector("article").textContent = "找不到這篇報告。";
  }
}

function route() {
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  slug ? renderReport(slug) : renderList();
}

fetch("reports.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : [])
  .catch(() => [])
  .then(data => { entries = data; route(); });
window.addEventListener("hashchange", route);
</script>
</body>
</html>
