 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#1565c0"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">一筆量測資料到 PE 的旅程</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">IT/OT</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 54 章</text><rect x="40" y="122" width="200" height="70" rx="10" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1.8" opacity="1"/><text x="140.0" y="162.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">① 感測器擷取影像或光譜</text><line x1="242" y1="157" x2="262" y2="157" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#ar-3f51b5)"/><text x="252" y="112" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="middle">私有網路</text><rect x="265" y="122" width="200" height="70" rx="10" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1.8" opacity="1"/><text x="365.0" y="152.2" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">② Module Server 計算</text><text x="365.0" y="173.0" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">線寬</text><line x1="467" y1="157" x2="487" y2="157" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#ar-3f51b5)"/><text x="477" y="112" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="middle">結果回傳</text><rect x="490" y="122" width="200" height="70" rx="10" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1.8" opacity="1"/><text x="590.0" y="162.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">③ 機台 IPC 彙整結果</text><line x1="692" y1="157" x2="712" y2="157" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#ar-3f51b5)"/><text x="702" y="112" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="middle">HSMS（S6F11）</text><rect x="715" y="122" width="200" height="70" rx="10" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1.8" opacity="1"/><text x="815.0" y="162.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">④ SECS/GEM 上報 EAP</text><path d="M 840 192 V 222 H 140 V 252" fill="none" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#ar-3f51b5)"/><rect x="40" y="256" width="200" height="70" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.8" opacity="1"/><text x="140.0" y="286.20000000000005" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑤ SPC 判定是否超出管制</text><text x="140.0" y="307.00000000000006" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">界限</text><line x1="242" y1="291" x2="262" y2="291" stroke="#e65100" stroke-width="2.5" marker-end="url(#ar-e65100)"/><rect x="265" y="256" width="200" height="70" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.8" opacity="1"/><text x="365.0" y="286.20000000000005" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑥ MES 擋下 (Hold) 這</text><text x="365.0" y="307.00000000000006" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">批</text><line x1="467" y1="291" x2="487" y2="291" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ar-2e7d32)"/><rect x="490" y="256" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" opacity="1"/><text x="590.0" y="296.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑦ PE 看管制圖與歷程</text><line x1="692" y1="291" x2="712" y2="291" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ar-2e7d32)"/><rect x="715" y="256" width="200" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" opacity="1"/><text x="815.0" y="286.20000000000005" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑧ 調整 APC 或重工後放</text><text x="815.0" y="307.00000000000006" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">行</text><circle cx="66" cy="364.05" r="4" fill="#1565c0" stroke="none" stroke-width="1.5"/><text x="80" y="370.0" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">原始影像與光譜另存檔案伺服器，不走 SECS/GEM</text><circle cx="66" cy="388.7" r="4" fill="#1565c0" stroke="none" stroke-width="1.5"/><text x="80" y="394.65" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">高頻感測波形另經 Interface A 送 FDC，可在晶圓還在機台上時就攔截異常</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#1565c0" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">機台產生資料、IT 系統判斷與擋貨、PE 做最後決策，三者缺一不可。</text></svg>