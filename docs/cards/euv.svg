" fill="#ffffff">EUV 光從哪裡來：雷射激發錫電漿</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">微影</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 14～15 章</text><rect x="40" y="120" width="200" height="70" rx="10" fill="#eef1fb" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="140.0" y="150.2" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">① 錫滴產生器噴出微小錫</text><text x="140.0" y="171.0" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">滴</text><line x1="242" y1="155" x2="262" y2="155" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="265" y="120" width="200" height="70" rx="10" fill="#eef1fb" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="365.0" y="150.2" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">② 預脈衝雷射把錫滴打成</text><text x="365.0" y="171.0" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">薄餅狀</text><line x1="467" y1="155" x2="487" y2="155" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="490" y="120" width="200" height="70" rx="10" fill="#eef1fb" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="590.0" y="150.2" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">③ 高功率 CO₂ 主脈衝雷</text><text x="590.0" y="171.0" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">射加熱</text><line x1="692" y1="155" x2="712" y2="155" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="715" y="120" width="200" height="70" rx="10" fill="#eef1fb" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="815.0" y="150.2" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">④ 錫電漿放出 13.5 nm </text><text x="815.0" y="171.0" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">EUV 光</text><path d="M 840 190 V 215 H 118 V 238" fill="none" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="40" y="242" width="158" height="70" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="119.0" y="282.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑤ 收集鏡聚光</text><line x1="200" y1="277" x2="216" y2="277" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="218" y="242" width="158" height="70" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="297.0" y="282.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑥ 照明系統</text><line x1="378" y1="277" x2="394" y2="277" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="396" y="242" width="158" height="70" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="475.0" y="282.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑦ 反射式光罩</text><line x1="556" y1="277" x2="572" y2="277" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="574" y="242" width="158" height="70" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.8" opacity="1"/><text x="653.0" y="272.20000000000005" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑧ 投影反射鏡（縮</text><text x="653.0" y="293.00000000000006" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">小 4 倍）</text><line x1="734" y1="277" x2="750" y2="277" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#ar-6a1b9a)"/><rect x="752" y="242" width="158" height="70" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.8" opacity="1"/><text x="831.0" y="282.6" font-size="16" fill="#1f2430" font-weight="normal" text-anchor="middle">⑨ 晶圓上的光阻</text><circle cx="66" cy="353.7" r="4" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="80" y="360.0" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">全程在真空中：13.5 nm 的光會被空氣與玻璃強烈吸收</text><circle cx="66" cy="379.8" r="4" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="80" y="386.1" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">沒有透鏡：所有光學元件都是鉬／矽多層膜反射鏡</text><circle cx="66" cy="405.90000000000003" r="4" fill="#6a1b9a" stroke="none" stroke-width="1.5"/><text x="80" y="412.20000000000005" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">光源每秒約打出 5 萬顆錫滴（典型值）</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#6a1b9a" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">EUV 用極短波長換解析度，代價是光源、真空與反射光學都極其複雜。</text></svg>