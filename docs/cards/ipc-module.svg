 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#1565c0"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">機台控制電腦 vs Module / Compute Server</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">IT/OT</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 48、54 章</text><rect x="50" y="115" width="380" height="255" rx="14" fill="#e3f2fd" stroke="#3f51b5" stroke-width="1.5" opacity="1"/><rect x="530" y="115" width="380" height="255" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" opacity="1"/><text x="240" y="152" font-size="21" fill="#3f51b5" font-weight="bold" text-anchor="middle">機台控制電腦（Tool IPC）</text><text x="720" y="152" font-size="21" fill="#e65100" font-weight="bold" text-anchor="middle">Module / Compute Server</text><circle cx="81" cy="188.7" r="4" fill="#3f51b5" stroke="none" stroke-width="1.5"/><text x="95" y="195.0" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">即時控制：機械手臂、閥門、載台</text><circle cx="81" cy="216.79999999999998" r="4" fill="#3f51b5" stroke="none" stroke-width="1.5"/><text x="95" y="223.1" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">執行配方與安全互鎖</text><circle cx="81" cy="244.89999999999998" r="4" fill="#3f51b5" stroke="none" stroke-width="1.5"/><text x="95" y="251.2" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">對外：SECS/GEM、Interface A</text><circle cx="81" cy="273.0" r="4" fill="#3f51b5" stroke="none" stroke-width="1.5"/><text x="95" y="279.3" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">追求穩定與可預期的反應時間</text><circle cx="561" cy="188.7" r="4" fill="#e65100" stroke="none" stroke-width="1.5"/><text x="575" y="195.0" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">影像處理、光譜擬合、缺陷比對</text><circle cx="561" cy="216.79999999999998" r="4" fill="#e65100" stroke="none" stroke-width="1.5"/><text x="575" y="223.1" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">大量平行運算（CPU／GPU／FPGA）</text><circle cx="561" cy="244.89999999999998" r="4" fill="#e65100" stroke="none" stroke-width="1.5"/><text x="575" y="251.2" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">只接機台私有網路，與廠區隔離</text><circle cx="561" cy="273.0" r="4" fill="#e65100" stroke="none" stroke-width="1.5"/><text x="575" y="279.3" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">輸出線寬、膜厚、缺陷座標等結果</text><line x1="436" y1="230" x2="524" y2="230" stroke="#5f6b7a" stroke-width="3" marker-end="url(#ar-5f6b7a)"/><line x1="524" y1="262" x2="436" y2="262" stroke="#5f6b7a" stroke-width="3" marker-end="url(#ar-5f6b7a)"/><text x="480" y="218" font-size="14" fill="#5f6b7a" font-weight="normal" text-anchor="middle">私有網路</text><text x="480" y="284" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">原始資料／結果</text><line x1="240" y1="405" x2="240" y2="376" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#ar-3f51b5)"/><text x="240" y="428" font-size="15" fill="#3f51b5" font-weight="normal" text-anchor="middle">對廠區：SECS/GEM 給 EAP、Interface A 給 FDC</text><line x1="720" y1="376" x2="720" y2="405" stroke="#e65100" stroke-width="2.5" marker-end="url(#ar-e65100)"/><text x="720" y="428" font-size="15" fill="#e65100" font-weight="normal" text-anchor="middle">原始影像與光譜另存檔案伺服器</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#1565c0" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">把重運算拆給專用伺服器，避免拖慢機台的即時控制。</text></svg>