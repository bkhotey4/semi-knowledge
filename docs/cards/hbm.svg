" opacity="1"/><text x="160" y="216" font-size="12" fill="#1f2430" font-weight="normal" text-anchor="start">DRAM 6</text><rect x="150" y="172" width="280" height="22" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1" opacity="1"/><text x="160" y="188" font-size="12" fill="#1f2430" font-weight="normal" text-anchor="start">DRAM 7</text><rect x="150" y="144" width="280" height="22" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1" opacity="1"/><text x="160" y="160" font-size="12" fill="#1f2430" font-weight="normal" text-anchor="start">DRAM 8</text><line x1="230" y1="140" x2="230" y2="400" stroke="#546e7a" stroke-width="3"/><line x1="280" y1="140" x2="280" y2="400" stroke="#546e7a" stroke-width="3"/><line x1="330" y1="140" x2="330" y2="400" stroke="#546e7a" stroke-width="3"/><line x1="380" y1="140" x2="380" y2="400" stroke="#546e7a" stroke-width="3"/><text x="290" y="128" font-size="15" fill="#5f6b7a" font-weight="normal" text-anchor="middle">矽穿孔 TSV 垂直貫穿</text><text x="445" y="260" font-size="18" fill="#e65100" font-weight="bold" text-anchor="start">8-Hi</text><circle cx="526" cy="143.7" r="4" fill="#ef6c00" stroke="none" stroke-width="1.5"/><text x="540" y="150.0" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">以矽穿孔 (TSV) 垂直連接 8～16 層 DRAM</text><circle cx="526" cy="175.79999999999998" r="4" fill="#ef6c00" stroke="none" stroke-width="1.5"/><text x="540" y="182.1" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">介面寬度：HBM3 每堆疊 1024 位元，HBM4 提</text><text x="540" y="208.2" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">升到 2048 位元</text><circle cx="526" cy="233.99999999999997" r="4" fill="#ef6c00" stroke="none" stroke-width="1.5"/><text x="540" y="240.29999999999998" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">放在 GPU 旁的中介層上，連線距離極短</text><circle cx="526" cy="266.09999999999997" r="4" fill="#ef6c00" stroke="none" stroke-width="1.5"/><text x="540" y="272.4" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="start">主要挑戰：散熱、堆疊良率、TSV 與鍵合製程</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#ef6c00" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">HBM 用「超寬介面＋極短距離」換取頻寬，不必把時脈拉到極高。</text></svg>