<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>
  
  <!-- 熱預算陰影區域 (定性表示) -->
  <polygon points="100,400 250,220 650,220 750,400" fill="#e0e0e0"/>
  
  <!-- 座標軸 -->
  <line x1="100" y1="400" x2="780" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="100" y1="400" x2="100" y2="50" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="440" font-family="sans-serif" font-size="16" text-anchor="middle">時間 (Time)</text>
  <text x="30" y="225" font-family="sans-serif" font-size="16" transform="rotate(-90 30,225)" text-anchor="middle">溫度 (Temperature)</text>
  <text x="400" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">不同退火技術之熱曲線比較</text>

  <!-- 爐管退火 (Furnace Anneal) - 黑色 -->
  <path d="M 100 400 L 250 220 L 650 220 L 750 400" fill="none" stroke="#000000" stroke-width="3"/>
  <text x="450" y="210" font-family="sans-serif" font-size="14" fill="#000000">爐管退火 (Furnace Anneal)</text>

  <!-- 浸壓退火 (Soak Anneal) - 藍色 -->
  <path d="M 100 400 L 180 140 L 320 140 L 400 400" fill="none" stroke="#0000ff" stroke-width="3"/>
  <text x="250" y="130" font-family="sans-serif" font-size="14" fill="#0000ff">浸壓退火 (Soak Anneal)</text>

  <!-- 尖峰退火 (Spike Anneal) - 紅色 -->
  <path d="M 100 400 L 150 80 L 200 400" fill="none" stroke="#ff0000" stroke-width="3"/>
  <text x="140" y="70" font-family="sans-serif" font-size="14" fill="#ff0000" text-anchor="middle">尖峰退火 (Spike Anneal)</text>

  <!-- 特徵標註 -->
  <line x1="105" y1="380" x2="140" y2="120" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="110" y="250" font-family="sans-serif" font-size="14" transform="rotate(-75 110,250)">高升溫率</text>
  
  <line x1="160" y1="120" x2="195" y2="380" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="190" y="250" font-family="sans-serif" font-size="14" transform="rotate(75 190,250)">高降溫率</text>

  <line x1="250" y1="250" x2="180" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="260" y="255" font-family="sans-serif" font-size="14">熱預算縮減 (Thermal Budget Reduction)</text>
  
  <text x="105" y="390" font-family="sans-serif" font-size="12">低升溫率</text>
  <text x="250" y="155" font-family="sans-serif" font-size="12" fill="#0000ff">持溫時間 (Dwell Time)</text>
  
  <!-- 典型值標註 -->
  <text x="600" y="380" font-family="sans-serif" font-size="14" font-style="italic">爐管：數十分鐘至數小時</text>
  <text x="600" y="400" font-family="sans-serif" font-size="14" font-style="italic">RTP：秒級 (Seconds)</text>
</svg>