<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- 定義箭頭 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orientation="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orientation="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0000ff"/>
    </marker>
  </defs>

  <!-- 區域背景與分隔線 -->
  <line x1="350" y1="50" x2="350" y2="400" stroke="#a0a0a0" stroke-dasharray="5,5" stroke-width="1"/>
  <line x1="550" y1="50" x2="550" y2="400" stroke="#a0a0a0" stroke-dasharray="5,5" stroke-width="1"/>
  <rect x="750" y="50" width="20" height="350" fill="#e0e0e0"/>
  <line x1="750" y1="50" x2="750" y2="400" stroke="#000000" stroke-width="2"/>

  <!-- 坐標軸 -->
  <line x1="80" y1="400" x2="780" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="400" x2="80" y2="30" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 曲線：電位 V (藍色) -->
  <!-- Vp=80, Vs=110, Vw=380 -->
  <path d="M 80,80 L 350,80 Q 450,85 550,110 Q 650,180 750,380" fill="none" stroke="#0000ff" stroke-width="3"/>
  
  <!-- 曲線：離子密度 ni (紅色) -->
  <!-- n0=150, ns=190, nw=240 -->
  <path d="M 80,150 L 350,150 Q 450,160 550,190 Q 650,210 750,240" fill="none" stroke="#ff0000" stroke-width="3"/>
  
  <!-- 曲線：電子密度 ne (綠色) -->
  <!-- n0=150, ns=190, nw=420 (快速下降) -->
  <path d="M 80,150 L 350,150 Q 450,160 550,190 Q 600,280 750,420" fill="none" stroke="#008000" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- 離子加速向量 -->
  <line x1="580" y1="300" x2="630" y2="300" stroke="#ff0000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="300" x2="720" y2="300" stroke="#ff0000" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 文字標籤 -->
  <text x="760" y="430" font-family="sans-serif" font-size="16" text-anchor="middle">位置 x</text>
  <text x="40" y="40" font-family="sans-serif" font-size="16">電位 V, 密度 n</text>
  
  <text x="215" y="30" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">電漿本體</text>
  <text x="215" y="55" font-family="sans-serif" font-size="14" text-anchor="middle">(Bulk Plasma)</text>
  
  <text x="450" y="30" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">預鞘層</text>
  <text x="450" y="55" font-family="sans-serif" font-size="14" text-anchor="middle">(Pre-sheath)</text>
  
  <text x="650" y="30" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">鞘層</text>
  <text x="650" y="55" font-family="sans-serif" font-size="14" text-anchor="middle">(Sheath)</text>
  
  <text x="765" y="200" font-family="sans-serif" font-size="16" writing-mode="tb" text-anchor="middle">壁面 / 晶圓</text>

  <!-- 物理量標註 -->
  <text x="90" y="75" font-family="sans-serif" font-size="14" fill="#0000ff">電漿電位 Vp</text>
  <text x="90" y="145" font-family="sans-serif" font-size="14" fill="#000000">本體密度 n0 (ni ≈ ne)</text>
  <text x="700" y="235" font-family="sans-serif" font-size="14" fill="#ff0000">ni</text>
  <text x="610" y="360" font-family="sans-serif" font-size="14" fill="#008000">ne (指數衰減)</text>
  <text x="700" y="395" font-family="sans-serif" font-size="14" fill="#0000ff">Vw</text>
  
  <text x="650" y="325" font-family="sans-serif" font-size="14" fill="#ff0000" text-anchor="middle">離子受電場加速</text>
  
  <!-- 淨電荷標註 -->
  <text x="650" y="160" font-family="sans-serif" font-size="14" fill="#000000" text-anchor="middle">淨正電荷區 (ni &gt; ne)</text>
  
  <!-- 波姆準則標註 -->
  <text x="550" y="215" font-family="sans-serif" font-size="12" text-anchor="middle">ns ≈ 0.61 n0</text>
</svg>