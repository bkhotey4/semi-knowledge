<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- 定義箭頭 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
  </defs>

  <!-- 矽基板 (Silicon Substrate) -->
  <rect x="150" y="100" width="500" height="250" fill="#E0E0E0"/>
  <text x="520" y="230" font-family="sans-serif" font-size="16" fill="#333333">矽基板 (Si Substrate)</text>

  <!-- 頂部 BEOL 層 (層間絕緣膜與金屬線) -->
  <rect x="150" y="40" width="500" height="60" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="320" y="60" width="160" height="20" fill="#D35400"/>
  <text x="520" y="75" font-family="sans-serif" font-size="16" fill="#333333">金屬內連線層 (BEOL)</text>

  <!-- TSV 結構主體 (由外而內) -->
  <!-- 1. 絕緣襯墊 (Liner) -->
  <rect x="345" y="100" width="110" height="250" fill="#4A90E2"/>
  <!-- 2. 阻障層 (Barrier) -->
  <rect x="352" y="100" width="96" height="250" fill="#333333"/>
  <!-- 3. 銅種子層 (Seed Layer) -->
  <rect x="355" y="100" width="90" height="250" fill="#E67E22"/>
  <!-- 4. 電鍍銅核心 (Cu Core) -->
  <rect x="358" y="80" width="84" height="300" fill="#D35400"/>

  <!-- 背面鈍化層與顯露部 -->
  <rect x="150" y="350" width="500" height="15" fill="#4A90E2" fill-opacity="0.6"/>
  <text x="520" y="390" font-family="sans-serif" font-size="16" fill="#333333">背面顯露接點 (TSV Reveal)</text>
  <line x1="515" y1="385" x2="445" y2="375" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 標籤與指引線 -->
  <!-- 絕緣襯墊 -->
  <text x="50" y="140" font-family="sans-serif" font-size="16" fill="#333333">絕緣襯墊 (Liner, SiO₂)</text>
  <line x1="215" y1="135" x2="343" y2="135" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 阻障層 -->
  <text x="50" y="190" font-family="sans-serif" font-size="16" fill="#333333">阻障層 (Barrier, Ta/TaN)</text>
  <line x1="230" y1="185" x2="350" y2="185" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 銅種子層 -->
  <text x="50" y="240" font-family="sans-serif" font-size="16" fill="#333333">銅種子層 (Seed Layer)</text>
  <line x1="215" y1="235" x2="353" y2="235" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 電鍍銅核心 -->
  <text x="50" y="290" font-family="sans-serif" font-size="16" fill="#333333">電鍍銅核心 (Cu Core)</text>
  <line x1="215" y1="285" x2="356" y2="285" stroke="#333333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 尺寸標註 (定性) -->
  <line x1="345" y1="410" x2="455" y2="410" stroke="#333333" stroke-width="1"/>
  <line x1="345" y1="405" x2="345" y2="415" stroke="#333333" stroke-width="1"/>
  <line x1="455" y1="405" x2="455" y2="415" stroke="#333333" stroke-width="1"/>
  <text x="365" y="430" font-family="sans-serif" font-size="14" fill="#333333">直徑 1-10 μm</text>

  <line x1="680" y1="100" x2="680" y2="350" stroke="#333333" stroke-width="1"/>
  <line x1="675" y1="100" x2="685" y2="100" stroke="#333333" stroke-width="1"/>
  <line x1="675" y1="350" x2="685" y2="350" stroke="#333333" stroke-width="1"/>
  <text x="690" y="230" font-family="sans-serif" font-size="14" fill="#333333">深度 50-100 μm</text>

  <!-- 圖名 -->
  <text x="400" y="25" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">矽穿孔 (TSV) 結構剖面示意圖</text>
</svg>