<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- 定義箭頭 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
  </defs>

  <!-- 真空區域外框 -->
  <rect x="20" y="60" width="760" height="330" fill="#fcfcfc" stroke="#cccccc" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="30" y="85" font-family="sans-serif" font-size="16" fill="#999999">真空環境區域</text>

  <!-- 1. 離子源 -->
  <rect x="40" y="180" width="80" height="80" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
  <circle cx="80" cy="220" r="20" fill="#ffcc00" opacity="0.6"/>
  <text x="45" y="280" font-family="sans-serif" font-size="16" fill="#000000">離子源</text>
  <text x="42" y="300" font-family="sans-serif" font-size="14" fill="#666666">(Ion Source)</text>

  <!-- 2. 質量分析器 (分析磁鐵) -->
  <path d="M 160 140 L 260 140 L 260 300 L 160 300 Z" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
  <path d="M 180 180 Q 220 180 220 220" fill="none" stroke="#0066cc" stroke-width="4" opacity="0.3"/>
  <text x="165" y="130" font-family="sans-serif" font-size="16" fill="#000000">質量分析器</text>
  <text x="160" y="320" font-family="sans-serif" font-size="14" fill="#666666">(Mass Analyzer)</text>
  <text x="175" y="225" font-family="sans-serif" font-size="14" fill="#333333">分析磁鐵</text>

  <!-- 3. 加速/減速管 -->
  <rect x="320" y="190" width="120" height="60" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
  <line x1="344" y1="190" x2="344" y2="250" stroke="#333333" stroke-width="1"/>
  <line x1="368" y1="190" x2="368" y2="250" stroke="#333333" stroke-width="1"/>
  <line x1="392" y1="190" x2="392" y2="250" stroke="#333333" stroke-width="1"/>
  <line x1="416" y1="190" x2="416" y2="250" stroke="#333333" stroke-width="1"/>
  <text x="330" y="280" font-family="sans-serif" font-size="16" fill="#000000">加速/減速管</text>
  <text x="325" y="300" font-family="sans-serif" font-size="14" fill="#666666">(Accel/Decel Tube)</text>

  <!-- 4. 掃描系統 -->
  <line x1="480" y1="180" x2="540" y2="180" stroke="#333333" stroke-width="3"/>
  <line x1="480" y1="260" x2="540" y2="260" stroke="#333333" stroke-width="3"/>
  <text x="475" y="280" font-family="sans-serif" font-size="16" fill="#000000">掃描系統</text>
  <text x="465" y="300" font-family="sans-serif" font-size="14" fill="#666666">(Scanning System)</text>

  <!-- 5. 終端站/反應室 -->
  <rect x="620" y="120" width="140" height="200" fill="#eeeeee" stroke="#333333" stroke-width="2"/>
  <line x1="720" y1="160" x2="720" y2="280" stroke="#666666" stroke-width="6"/>
  <text x="730" y="225" font-family="sans-serif" font-size="14" fill="#333333">晶圓</text>
  <path d="M 740 180 L 755 180 L 755 260 L 740 260" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="655" y="110" font-family="sans-serif" font-size="16" fill="#000000">終端站</text>
  <text x="645" y="340" font-family="sans-serif" font-size="14" fill="#666666">(End Station)</text>
  <text x="650" y="150" font-family="sans-serif" font-size="14" fill="#333333">法拉第杯</text>
  <rect x="640" y="160" width="15" height="120" fill="#cccccc" stroke="#333333"/>

  <!-- 離子束流向 -->
  <!-- 離子源到分析器 -->
  <line x1="120" y1="220" x2="150" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 分析器內部的篩選路徑 -->
  <path d="M 210 220 Q 240 220 240 180" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="245" y="175" font-family="sans-serif" font-size="12" fill="#ff0000">雜質離子</text>
  
  <!-- 通過篩選的離子束 -->
  <line x1="260" y1="220" x2="310" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="220" x2="470" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 掃描後的離子束 -->
  <path d="M 540 220 L 620 200" fill="none" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 220 L 620 240" fill="none" stroke="#0066cc" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="220" x2="610" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <text x="350" y="170" font-family="sans-serif" font-size="16" fill="#0066cc" font-weight="bold">離子束 (Ion Beam)</text>

</svg>