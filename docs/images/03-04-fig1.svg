<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF0000" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1" />
    </marker>
  </defs>

  <path d="M 160 60 A 450 400 0 0 0 160 390" fill="none" stroke="#808080" stroke-width="8"/>
  <line x1="120" y1="225" x2="165" y2="225" stroke="#ffffff" stroke-width="12"/>
  
  <rect x="320" y="20" width="60" height="40" fill="#808080"/>
  <line x1="350" y1="60" x2="350" y2="210" stroke="#808080" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="350" cy="90" r="4" fill="#FFA500"/>
  <circle cx="350" cy="140" r="4" fill="#FFA500"/>
  <circle cx="350" cy="190" r="4" fill="#FFA500"/>

  <path d="M 350 225 L 340 215 L 350 200 L 360 215 L 375 225 L 360 235 L 350 250 L 340 235 Z" fill="#FFA500"/>
  
  <line x1="20" y1="215" x2="330" y2="215" stroke="#FF0000" stroke-width="1" marker-end="url(#arrow-red)"/>
  <line x1="20" y1="235" x2="330" y2="235" stroke="#FF0000" stroke-width="3" marker-end="url(#arrow-red)"/>

  <line x1="350" y1="225" x2="155" y2="100" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="2"/>
  <line x1="350" y1="225" x2="155" y2="350" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="2"/>
  
  <line x1="155" y1="100" x2="740" y2="222" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="155" y1="350" x2="740" y2="228" stroke="#4169E1" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="750" y="150" width="10" height="60" fill="#808080"/>
  <rect x="750" y="240" width="10" height="60" fill="#808080"/>
  <circle cx="750" cy="225" r="5" fill="#4169E1"/>

  <text x="390" y="45" font-family="sans-serif" font-size="16" fill="#000000">液態錫滴產生器 (DG)</text>
  <text x="30" y="200" font-family="sans-serif" font-size="14" fill="#FF0000">預脈衝 (Pre-pulse)</text>
  <text x="30" y="260" font-family="sans-serif" font-size="14" fill="#FF0000">主脈衝 (Main-pulse)</text>
  <text x="100" y="420" font-family="sans-serif" font-size="16" fill="#000000">橢球面集光鏡 (Collector)</text>
  <text x="380" y="230" font-family="sans-serif" font-size="16" fill="#000000">錫電漿 (F1 焦點)</text>
  <text x="630" y="210" font-family="sans-serif" font-size="16" fill="#000000">中間焦點 (IF)</text>
  <text x="450" y="150" font-family="sans-serif" font-size="14" fill="#4169E1">EUV 輻射 (13.5 nm)</text>
  <text x="30" y="180" font-family="sans-serif" font-size="14" fill="#000000">CO2 雷射</text>
</svg>