<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- 箭頭標記：藍色（離子/電場） -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#2563eb"/>
    </marker>
    <!-- 箭頭標記：綠色（自由基擴散） -->
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#059669"/>
    </marker>
    <!-- 箭頭標記：橘色（副產物脫附） -->
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#d97706"/>
    </marker>
    <!-- 箭頭標記：灰色（尺寸與界線） -->
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 1 L 5 3 L 0 5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 圖名與副標題 -->
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">反應性離子蝕刻（RIE）協同效應機制</text>
  <text x="400" y="54" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">離子輔助化學反應：R(RIE) ≫ R(化學) + R(物理濺鍍)</text>

  <!-- 2. 區域劃分背景 -->
  <!-- 電漿區 -->
  <rect x="50" y="70" width="700" height="65" fill="#ffffff" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="65" y="92" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">主體電漿區（Bulk Plasma）</text>

  <!-- 鞘層區 -->
  <rect x="50" y="135" width="700" height="120" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="65" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">電漿鞘層（Sheath，自偏壓電場加速區）</text>

  <!-- 鞘層電場指示 -->
  <line x1="720" y1="165" x2="720" y2="235" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="710" y="205" text-anchor="end" font-family="sans-serif" font-size="14" fill="#2563eb">垂直電場 E</text>

  <!-- 3. 晶圓基底與表面活化層 -->
  <!-- 晶圓矽基底 -->
  <rect x="50" y="280" width="700" height="100" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">矽晶圓基材（Si Substrate）</text>

  <!-- 表面反應與晶格鍵結破壞層 -->
  <rect x="50" y="255" width="700" height="25" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <line x1="50" y1="280" x2="750" y2="280" stroke="#d97706" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="65" y="272" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">表面活化層（離子衝擊破壞鍵結與化學吸附層）</text>

  <!-- 4. 機制一：中性自由基等向擴散與吸附（左側） -->
  <!-- 電漿中自由基物種 -->
  <circle cx="160" cy="100" r="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="160" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">F*</text>

  <circle cx="250" cy="85" r="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="250" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">F*</text>

  <!-- 擴散隨機路徑與吸附箭頭 -->
  <path d="M 160 114 Q 140 160 190 190 T 210 248" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <path d="M 250 100 Q 280 150 250 195 T 270 248" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>

  <text x="145" y="180" font-family="sans-serif" font-size="14" fill="#059669">中性自由基擴散</text>
  <text x="145" y="198" font-family="sans-serif" font-size="14" fill="#059669">（等向性熱運動）</text>

  <!-- 表面吸附原子 -->
  <circle cx="210" cy="255" r="5" fill="#059669"/>
  <circle cx="270" cy="255" r="5" fill="#059669"/>
  <text x="240" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">化學吸附</text>

  <!-- 5. 機制二：正離子垂直轟擊破壞晶格（中央） -->
  <!-- 電漿中正離子物種 -->
  <circle cx="390" cy="100" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Ar⁺</text>

  <circle cx="470" cy="100" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">CF₃⁺</text>

  <!-- 垂直加速直線箭頭 -->
  <line x1="390" y1="120" x2="390" y2="248" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="470" y1="120" x2="470" y2="248" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <text x="480" y="170" font-family="sans-serif" font-size="14" fill="#2563eb">高能正離子</text>
  <text x="480" y="188" font-family="sans-serif" font-size="14" fill="#2563eb">受電場引導垂直撞擊</text>

  <!-- 撞擊破壞符號 -->
  <polygon points="390,252 385,260 395,260" fill="#d97706"/>
  <polygon points="470,252 465,260 475,260" fill="#d97706"/>
  <text x="430" y="298" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">破壞 Si–Si 化學鍵 / 產生反應位點</text>

  <!-- 6. 機制三：促進表面化學反應與副產物去吸附（右側） -->
  <!-- 去吸附脫離路徑 -->
  <line x1="590" y1="250" x2="620" y2="175" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="625" cy="160" r="18" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="625" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706">SiF₄↑</text>

  <text x="560" y="200" text-anchor="end" font-family="sans-serif" font-size="14" fill="#d97706">反應生成揮發副產物</text>
  <text x="560" y="218" text-anchor="end" font-family="sans-serif" font-size="14" fill="#d97706">去吸附（脫附排出）</text>

  <!-- 7. 底部總結：協同效應三個關鍵流程標註 -->
  <rect x="50" y="395" width="700" height="42" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="70" y="421" font-family="sans-serif" font-size="14" fill="#059669">步驟 1：自由基化學吸附</text>
  <text x="270" y="421" font-family="sans-serif" font-size="14" fill="#2563eb">步驟 2：離子轟擊提供活化能</text>
  <text x="510" y="421" font-family="sans-serif" font-size="14" fill="#d97706">步驟 3：快速生成揮發物脫離</text>
</svg>