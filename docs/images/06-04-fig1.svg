<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">晶背供電架構（BSPDN）剖面示意圖</text>

  <!-- Layer 1: Frontside Signal Interconnect Layer -->
  <rect x="120" y="45" width="380" height="105" fill="#E2E8F0" rx="4" stroke="#1E293B" stroke-width="1.5"/>
  <text x="130" y="65" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563EB">正面互連層 (Signal Routing)</text>
  
  <!-- Signal Metals & Vias -->
  <rect x="240" y="75" width="90" height="10" rx="2" fill="#2563EB"/>
  <rect x="360" y="75" width="110" height="10" rx="2" fill="#2563EB"/>
  
  <rect x="180" y="98" width="110" height="10" rx="2" fill="#2563EB"/>
  <rect x="320" y="98" width="130" height="10" rx="2" fill="#2563EB"/>
  
  <rect x="150" y="122" width="80" height="10" rx="2" fill="#2563EB"/>
  <rect x="260" y="122" width="90" height="10" rx="2" fill="#2563EB"/>
  <rect x="380" y="122" width="100" height="10" rx="2" fill="#2563EB"/>

  <rect x="275" y="85" width="8" height="13" fill="#2563EB"/>
  <rect x="385" y="85" width="8" height="13" fill="#2563EB"/>
  <rect x="205" y="108" width="8" height="14" fill="#2563EB"/>
  <rect x="335" y="108" width="8" height="14" fill="#2563EB"/>

  <!-- Layer 2: Transistor & Buried Power Rail (BPR) Layer -->
  <rect x="120" y="150" width="380" height="80" fill="#ffffff" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Transistor Gates (FEOL) -->
  <rect x="170" y="165" width="35" height="25" rx="2" fill="#1E293B"/>
  <text x="187" y="182" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">G</text>
  
  <rect x="290" y="165" width="35" height="25" rx="2" fill="#1E293B"/>
  <text x="307" y="182" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">G</text>
  
  <rect x="410" y="165" width="35" height="25" rx="2" fill="#1E293B"/>
  <text x="427" y="182" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">G</text>

  <!-- Contacts to BPR -->
  <rect x="233" y="175" width="14" height="25" fill="#D97706"/>
  <rect x="353" y="175" width="14" height="25" fill="#D97706"/>

  <!-- Buried Power Rails (BPR) -->
  <rect x="222" y="200" width="36" height="20" rx="3" fill="#D97706"/>
  <text x="240" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VDD</text>
  
  <rect x="342" y="200" width="36" height="20" rx="3" fill="#D97706"/>
  <text x="360" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VSS</text>

  <!-- Layer 3: Thinned Silicon Substrate & Nano-TSV -->
  <rect x="120" y="230" width="380" height="90" fill="#1E293B" opacity="0.12"/>
  <rect x="120" y="230" width="380" height="90" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Nano-TSV / PowerVia -->
  <rect x="233" y="220" width="14" height="100" fill="#D97706"/>
  <rect x="353" y="220" width="14" height="100" fill="#D97706"/>

  <!-- Layer 4: Backside Power Delivery Network (BSPDN) -->
  <rect x="120" y="320" width="380" height="90" fill="#E2E8F0" rx="4" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Backside Metal 0 (BM0) -->
  <rect x="220" y="330" width="40" height="18" rx="2" fill="#D97706"/>
  <rect x="340" y="330" width="40" height="18" rx="2" fill="#D97706"/>
  
  <!-- Backside Vias -->
  <rect x="233" y="348" width="14" height="17" fill="#D97706"/>
  <rect x="353" y="348" width="14" height="17" fill="#D97706"/>

  <!-- Backside Metal 1 (BM1 Power Mesh) -->
  <rect x="160" y="365" width="260" height="25" rx="4" fill="#D97706"/>
  <text x="290" y="382" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">晶背供電金屬層 (Power Rail)</text>

  <!-- Current Path Arrows (Upward Delivery) -->
  <path d="M 240 395 L 240 168" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <path d="M 360 395 L 360 168" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Left Callout: Upward Current Flow -->
  <path d="M 70 390 L 70 160" stroke="#DC2626" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="60" y="260" font-family="sans-serif" font-size="15" font-weight="bold" fill="#DC2626" text-anchor="end">電流向上傳輸</text>
  <text x="60" y="280" font-family="sans-serif" font-size="14" fill="#DC2626" text-anchor="end">(低 IR Drop 路徑)</text>

  <!-- Right Callouts & Label Descriptions -->
  <!-- Callout 1 -->
  <line x1="500" y1="95" x2="535" y2="95" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="500" cy="95" r="3" fill="#1E293B"/>
  <text x="545" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">正面訊號層</text>
  <text x="545" y="110" font-family="sans-serif" font-size="14" fill="#2563EB">專職邏輯訊號繞線 (M1-M3)</text>

  <!-- Callout 2 -->
  <line x1="500" y1="190" x2="535" y2="190" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="500" cy="190" r="3" fill="#1E293B"/>
  <text x="545" y="185" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">電晶體層與埋入式電軌</text>
  <text x="545" y="205" font-family="sans-serif" font-size="14" fill="#D97706">BPR 直接連接電晶體源極</text>

  <!-- Callout 3 -->
  <line x1="500" y1="275" x2="535" y2="275" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="500" cy="275" r="3" fill="#1E293B"/>
  <text x="545" y="270" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">薄化矽基板與奈米矽穿孔</text>
  <text x="545" y="290" font-family="sans-serif" font-size="14" fill="#1E293B">Nano-TSV / PowerVia (&lt; 500 nm)</text>

  <!-- Callout 4 -->
  <line x1="500" y1="365" x2="535" y2="365" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="500" cy="365" r="3" fill="#1E293B"/>
  <text x="545" y="360" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">晶背供電金屬層 (BSPDN)</text>
  <text x="545" y="380" font-family="sans-serif" font-size="14" fill="#D97706">低電阻厚金屬電源分配網路</text>
</svg>