<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
    </marker>
    <marker id="heat-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f1a208"/>
    </marker>
  </defs>

  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">摻質活化與晶格修復示意圖</text>

  <g transform="translate(100, 100)">
    <text x="100" y="-20" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333333">佈植後損傷狀態 (As-implanted)</text>
    
    <line x1="0" y1="40" x2="200" y2="40" stroke="#cccccc" stroke-width="1"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#cccccc" stroke-width="1"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#cccccc" stroke-width="1"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#cccccc" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="200" stroke="#cccccc" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#cccccc" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="200" stroke="#cccccc" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#cccccc" stroke-width="1"/>

    <circle cx="40" cy="40" r="12" fill="#cccccc"/>
    <circle cx="80" cy="40" r="12" fill="#cccccc"/>
    <circle cx="120" cy="40" r="12" fill="#cccccc"/>
    <circle cx="160" cy="40" r="12" fill="#cccccc"/>
    
    <circle cx="40" cy="80" r="12" fill="#cccccc"/>
    <circle cx="140" cy="100" r="12" fill="#cccccc"/> 
    <circle cx="160" cy="80" r="12" fill="#cccccc"/>
    
    <circle cx="40" cy="120" r="12" fill="#cccccc"/>
    <circle cx="80" cy="120" r="12" fill="#cccccc"/>
    <circle cx="160" cy="120" r="12" fill="#cccccc"/>
    
    <circle cx="40" cy="160" r="12" fill="#cccccc"/>
    <circle cx="80" cy="160" r="12" fill="#cccccc"/>
    <circle cx="120" cy="160" r="12" fill="#cccccc"/>
    <circle cx="160" cy="160" r="12" fill="#cccccc"/>

    <circle cx="100" cy="90" r="12" fill="#e63946"/>
    
    <path d="M 100 90 Q 110 110 118 118" fill="none" stroke="#333333" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
    <path d="M 140 100 Q 130 90 122 82" fill="none" stroke="#333333" stroke-dasharray="4" marker-end="url(#arrowhead)"/>

    <text x="20" y="230" font-family="sans-serif" font-size="14" fill="#333333">● 矽原子 (Si)</text>
    <text x="20" y="255" font-family="sans-serif" font-size="14" fill="#e63946">● 摻質原子 (Dopant)</text>
    <text x="180" y="95" font-family="sans-serif" font-size="14" fill="#333333">間隙位</text>
    <text x="100" y="135" font-family="sans-serif" font-size="14" fill="#333333" text-anchor="middle">空缺</text>
  </g>

  <g transform="translate(350, 180)">
    <line x1="0" y1="20" x2="100" y2="20" stroke="#f1a208" stroke-width="4" marker-end="url(#heat-arrow)"/>
    <text x="50" y="10" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#f1a208">熱能驅動</text>
    <text x="50" y="50" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#f1a208">退火 (Annealing)</text>
  </g>

  <g transform="translate(500, 100)">
    <text x="100" y="-20" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#333333">退火後活化狀態 (Post-anneal)</text>
    
    <line x1="0" y1="40" x2="200" y2="40" stroke="#cccccc" stroke-width="1"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#cccccc" stroke-width="1"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#cccccc" stroke-width="1"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#cccccc" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="200" stroke="#cccccc" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#cccccc" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="200" stroke="#cccccc" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#cccccc" stroke-width="1"/>

    <circle cx="40" cy="40" r="12" fill="#cccccc"/>
    <circle cx="80" cy="40" r="12" fill="#cccccc"/>
    <circle cx="120" cy="40" r="12" fill="#cccccc"/>
    <circle cx="160" cy="40" r="12" fill="#cccccc"/>
    
    <circle cx="40" cy="80" r="12" fill="#cccccc"/>
    <circle cx="80" cy="80" r="12" fill="#cccccc"/>
    <circle cx="120" cy="80" r="12" fill="#e63946"/>
    <circle cx="160" cy="80" r="12" fill="#cccccc"/>
    
    <circle cx="40" cy="120" r="12" fill="#cccccc"/>
    <circle cx="80" cy="120" r="12" fill="#cccccc"/>
    <circle cx="120" cy="120" r="12" fill="#cccccc"/>
    <circle cx="160" cy="120" r="12" fill="#cccccc"/>
    
    <circle cx="40" cy="160" r="12" fill="#cccccc"/>
    <circle cx="80" cy="160" r="12" fill="#cccccc"/>
    <circle cx="120" cy="160" r="12" fill="#cccccc"/>
    <circle cx="160" cy="160" r="12" fill="#cccccc"/>

    <text x="180" y="95" font-family="sans-serif" font-size="14" fill="#e63946">取代位</text>
    <rect x="20" y="215" width="160" height="60" fill="none" stroke="#333333" stroke-dasharray="2"/>
    <text x="100" y="235" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">晶格重組 (Recovery)</text>
    <text x="100" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">電性活化 (Activation)</text>
  </g>
</svg>