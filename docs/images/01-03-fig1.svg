<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- 箭頭標記：黑色 -->
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0f172a"/>
    </marker>
    <!-- 箭頭標記：紅色 -->
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#dc2626"/>
    </marker>
    <!-- 雙向起點箭頭：黑色 -->
    <marker id="arrow-slate-rev" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 7 1 L 1 4 L 7 7 Z" fill="#0f172a"/>
    </marker>
    <!-- 雙向起點箭頭：紅色 -->
    <marker id="arrow-red-rev" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 7 1 L 1 4 L 7 7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 空乏區陰影底色 -->
  <rect x="270" y="50" width="260" height="370" fill="#f1f5f9"/>

  <!-- 頂部結構標記與分區 -->
  <text x="180" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">P 型區 (P-type)</text>
  <text x="400" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">冶金接面</text>
  <text x="620" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">N 型區 (N-type)</text>

  <!-- 空間電荷區邊界與接面中心虛線 -->
  <line x1="270" y1="42" x2="270" y2="420" stroke="#0f172a" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="400" y1="42" x2="400" y2="420" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="530" y1="42" x2="530" y2="420" stroke="#0f172a" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- 空間電荷區離子分佈示意 -->
  <!-- P 側負離子 (受體 NA-) -->
  <circle cx="310" cy="75" r="11" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="304" y1="75" x2="316" y2="75" stroke="#dc2626" stroke-width="2"/>
  <circle cx="360" cy="75" r="11" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="354" y1="75" x2="366" y2="75" stroke="#dc2626" stroke-width="2"/>
  <circle cx="310" cy="105" r="11" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="304" y1="105" x2="316" y2="105" stroke="#dc2626" stroke-width="2"/>
  <circle cx="360" cy="105" r="11" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="354" y1="105" x2="366" y2="105" stroke="#dc2626" stroke-width="2"/>
  <text x="335" y="132" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">負受體離子 (NA⁻)</text>

  <!-- N 側正離子 (施體 ND+) -->
  <circle cx="440" cy="75" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="434" y1="75" x2="446" y2="75" stroke="#2563eb" stroke-width="2"/>
  <line x1="440" y1="69" x2="440" y2="81" stroke="#2563eb" stroke-width="2"/>
  <circle cx="490" cy="75" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="484" y1="75" x2="496" y2="75" stroke="#2563eb" stroke-width="2"/>
  <line x1="490" y1="69" x2="490" y2="81" stroke="#2563eb" stroke-width="2"/>
  <circle cx="440" cy="105" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="434" y1="105" x2="446" y2="105" stroke="#2563eb" stroke-width="2"/>
  <line x1="440" y1="99" x2="440" y2="111" stroke="#2563eb" stroke-width="2"/>
  <circle cx="490" cy="105" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="484" y1="105" x2="496" y2="105" stroke="#2563eb" stroke-width="2"/>
  <line x1="490" y1="99" x2="490" y2="111" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="132" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">正施體離子 (ND⁺)</text>

  <!-- 空乏區寬度尺寸標示 -->
  <line x1="270" y1="150" x2="530" y2="150" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrow-slate-rev)" marker-end="url(#arrow-slate)"/>
  <text x="400" y="145" font-family="sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">空乏區 (Depletion Region) 寬度 W</text>
  <text x="270" y="166" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">-xp</text>
  <text x="400" y="166" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">x = 0</text>
  <text x="530" y="166" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">+xn</text>

  <!-- 左側電子能量坐標軸 -->
  <line x1="65" y1="410" x2="65" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="55" y="185" font-family="sans-serif" font-size="15" fill="#0f172a" text-anchor="start">電子能量 (E)</text>

  <!-- 導電帶 Ec 曲線 (連續 S 形彎曲) -->
  <path d="M 80 205 L 270 205 C 345 205, 355 285, 400 285 C 445 285, 455 285, 530 285 L 720 285" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="85" y="197" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Ec (傳導帶底)</text>
  <text x="725" y="280" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Ec</text>

  <!-- 費米能階 Ef (熱平衡水平直線) -->
  <line x1="80" y1="300" x2="720" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="85" y="292" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Ef (費米能階)</text>
  <text x="725" y="305" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Ef</text>

  <!-- 價電帶 Ev 曲線 (連續 S 形彎曲，帶隙 Eg = 110px 保持恆定) -->
  <path d="M 80 315 L 270 315 C 345 315, 355 395, 400 395 C 445 395, 455 395, 530 395 L 720 395" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="85" y="333" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Ev (價電帶頂)</text>
  <text x="725" y="400" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Ev</text>

  <!-- 能隙 Eg 標示 (在 P 區中性區) -->
  <line x1="220" y1="210" x2="220" y2="310" stroke="#0f172a" stroke-width="1.2" marker-start="url(#arrow-slate-rev)" marker-end="url(#arrow-slate)"/>
  <text x="212" y="265" font-family="sans-serif" font-size="15" fill="#0f172a" text-anchor="end">能隙 Eg</text>

  <!-- 內建位能障礙 qVbi 標示 -->
  <!-- 自 P 區 Ec 延伸之水平參考線 -->
  <line x1="270" y1="205" x2="685" y2="205" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- 自 N 區 Ec 延伸之對齊線 -->
  <line x1="685" y1="210" x2="685" y2="280" stroke="#dc2626" stroke-width="1.8" marker-start="url(#arrow-red-rev)" marker-end="url(#arrow-red)"/>
  <text x="695" y="248" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">qVbi</text>
  <text x="695" y="268" font-family="sans-serif" font-size="14" fill="#0f172a">(位能障礙)</text>
</svg>