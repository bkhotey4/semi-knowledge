<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
  
  <!-- 封裝基板 -->
  <rect x="50" y="360" width="700" height="60" fill="#eeeeee" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="400" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000000">封裝基板 (Package Substrate)</text>

  <!-- C4 凸塊 -->
  <circle cx="150" cy="335" r="15" fill="#b87333" stroke="#000000"/>
  <circle cx="250" cy="335" r="15" fill="#b87333" stroke="#000000"/>
  <circle cx="350" cy="335" r="15" fill="#b87333" stroke="#000000"/>
  <circle cx="450" cy="335" r="15" fill="#b87333" stroke="#000000"/>
  <circle cx="550" cy="335" r="15" fill="#b87333" stroke="#000000"/>
  <circle cx="650" cy="335" r="15" fill="#b87333" stroke="#000000"/>
  <text x="680" y="340" font-family="sans-serif" font-size="16" fill="#000000">C4 凸塊</text>

  <!-- 矽中介層主體 -->
  <rect x="80" y="180" width="640" height="130" fill="#d0d0d0" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="250" font-family="sans-serif" font-size="18" fill="#000000">矽中介層 (Silicon Interposer)</text>

  <!-- 矽穿孔 TSV -->
  <rect x="145" y="220" width="10" height="90" fill="#b87333"/>
  <rect x="245" y="220" width="10" height="90" fill="#b87333"/>
  <rect x="345" y="220" width="10" height="90" fill="#b87333"/>
  <rect x="445" y="220" width="10" height="90" fill="#b87333"/>
  <rect x="545" y="220" width="10" height="90" fill="#b87333"/>
  <rect x="645" y="220" width="10" height="90" fill="#b87333"/>
  
  <line x1="600" y1="265" x2="640" y2="265" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="605" y="260" font-family="sans-serif" font-size="14" text-anchor="end" fill="#000000">矽穿孔 (TSV)</text>

  <!-- 重佈線層 RDL -->
  <rect x="80" y="180" width="640" height="25" fill="#b87333" fill-opacity="0.3"/>
  <line x1="100" y1="185" x2="700" y2="185" stroke="#b87333" stroke-width="3"/>
  <line x1="100" y1="195" x2="700" y2="195" stroke="#b87333" stroke-width="3"/>
  <line x1="600" y1="205" x2="650" y2="195" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="595" y="210" font-family="sans-serif" font-size="14" text-anchor="end" fill="#000000">重佈線層 (RDL)</text>

  <!-- 微凸塊 Micro-bumps -->
  <circle cx="120" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="160" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="200" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="240" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="280" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="320" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="480" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="520" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="560" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="600" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="640" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  <circle cx="680" cy="170" r="6" fill="#b87333" stroke="#000000"/>
  
  <line x1="400" y1="170" x2="470" y2="170" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="395" y="175" font-family="sans-serif" font-size="14" text-anchor="end" fill="#000000">微凸塊 (Micro-bump)</text>

  <!-- 上層晶片 SoC & HBM -->
  <rect x="100" y="50" width="250" height="110" fill="#a0a0a0" stroke="#000000" stroke-width="1.5"/>
  <text x="225" y="110" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">SoC 邏輯晶片</text>
  
  <rect x="450" y="50" width="250" height="110" fill="#a0a0a0" stroke="#000000" stroke-width="1.5"/>
  <text x="575" y="110" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">HBM 高頻寬記憶體</text>

  <!-- 標題 -->
  <text x="400" y="30" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">圖 38-5：矽中介層 (Silicon Interposer) 結構剖面示意圖</text>
</svg>