<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0000ff"/>
    </marker>
  </defs>

  <!-- 陰極與陽極結構 -->
  <rect x="150" y="80" width="500" height="20" fill="#cccccc" stroke="#000000" stroke-width="1"/>
  <text x="660" y="95" font-family="sans-serif" font-size="16" fill="#000000">陰極靶材 (Cathode)</text>
  
  <rect x="150" y="380" width="500" height="20" fill="#cccccc" stroke="#000000" stroke-width="1"/>
  <text x="660" y="395" font-family="sans-serif" font-size="16" fill="#000000">陽極基板 (Anode)</text>

  <!-- 永久磁鐵配置 (N-S-N) -->
  <rect x="200" y="30" width="60" height="50" fill="#ff4444" stroke="#000000"/>
  <text x="222" y="60" font-family="sans-serif" font-size="16" fill="#ffffff">N</text>
  
  <rect x="370" y="30" width="60" height="50" fill="#4444ff" stroke="#000000"/>
  <text x="392" y="60" font-family="sans-serif" font-size="16" fill="#ffffff">S</text>
  
  <rect x="540" y="30" width="60" height="50" fill="#ff4444" stroke="#000000"/>
  <text x="562" y="60" font-family="sans-serif" font-size="16" fill="#ffffff">N</text>
  
  <text x="350" y="20" font-family="sans-serif" font-size="16" fill="#000000">永久磁鐵組</text>

  <!-- 磁力線 (弧形) -->
  <path d="M 230 100 Q 300 180 370 100" fill="none" stroke="#4444ff" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-blue)"/>
  <path d="M 570 100 Q 500 180 430 100" fill="none" stroke="#4444ff" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-blue)"/>
  <text x="260" y="185" font-family="sans-serif" font-size="14" fill="#4444ff">磁力線 B</text>

  <!-- 電場指示 -->
  <line x1="100" y1="360" x2="100" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="240" font-family="sans-serif" font-size="16" fill="#000000" transform="rotate(-90 60,240)">電場 E</text>

  <!-- 電漿區標示 -->
  <rect x="150" y="150" width="500" height="180" fill="#ffff00" fill-opacity="0.1" stroke="#ffcc00" stroke-dasharray="4,2"/>
  <text x="370" y="250" font-family="sans-serif" font-size="18" fill="#ffcc00" font-weight="bold">電漿區 (Plasma)</text>

  <!-- 電子螺旋路徑 (E x B 漂移示意) -->
  <path d="M 240 110 C 250 140, 270 140, 280 110 C 290 140, 310 140, 320 110 C 330 140, 350 140, 360 110" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <circle cx="240" cy="110" r="4" fill="#ffcc00"/>
  <text x="240" y="100" font-family="sans-serif" font-size="14" fill="#000000">電子螺旋運動</text>

  <!-- 碰撞過程示意 -->
  <!-- 氬原子 -->
  <circle cx="450" cy="280" r="10" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="442" y="285" font-family="sans-serif" font-size="12" fill="#000000">Ar</text>
  
  <!-- 氬離子 -->
  <circle cx="520" cy="200" r="10" fill="none" stroke="#4444ff" stroke-width="1"/>
  <text x="510" y="205" font-family="sans-serif" font-size="12" fill="#4444ff">Ar⁺</text>
  
  <!-- 碰撞箭頭 -->
  <line x1="280" y1="135" x2="440" y2="275" stroke="#ffcc00" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="460" y="310" font-family="sans-serif" font-size="14" fill="#000000">碰撞游離反應</text>
  
  <!-- 濺鍍原子 -->
  <circle cx="400" y="110" r="3" fill="#666666"/>
  <line x1="400" y1="110" x2="400" y2="370" stroke="#666666" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow)"/>
  <text x="410" y="350" font-family="sans-serif" font-size="14" fill="#666666">濺鍍原子沉積</text>

  <!-- 圖名 -->
  <text x="400" y="430" font-family="sans-serif" font-size="20" fill="#000000" text-anchor="middle" font-weight="bold">圖 22-5 磁控濺鍍物理原理與電子約束示意圖</text>
</svg>