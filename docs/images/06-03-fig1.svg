<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- 1. 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">自對準通孔（SAV）結構剖面與微影偏移自對準機制</text>

  <!-- 2. 層間介電層 (Low-k ILD) 主體區域 -->
  <rect x="120" y="90" width="540" height="160" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <rect x="120" y="250" width="540" height="120" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>

  <!-- 3. 下層金屬線 (Mx) -->
  <!-- 相鄰金屬線 -->
  <rect x="180" y="270" width="160" height="100" fill="#d97706" stroke="#0f172a" stroke-width="2"/>
  <text x="260" y="328" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">相鄰金屬線 (Mx)</text>

  <!-- 目標金屬線 -->
  <rect x="440" y="270" width="160" height="100" fill="#d97706" stroke="#0f172a" stroke-width="2"/>
  <text x="520" y="328" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">目標金屬線 (Mx)</text>

  <!-- 4. 介電質硬遮罩 (Dielectric Hardmask / Cap Layer) -->
  <!-- 保護相鄰金屬線及間隙區域，厚度 20px -->
  <rect x="180" y="250" width="260" height="20" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  <!-- 目標金屬線右側硬遮罩 -->
  <rect x="600" y="250" width="60" height="20" fill="#475569" stroke="#0f172a" stroke-width="2"/>

  <!-- 5. 通孔 (Via) - 展現微影向左偏離但自對準 -->
  <!-- 通孔開口由 X=300 跨越至 X=510，橫跨相鄰金屬上方，但受硬遮罩阻擋形成階梯自對準 -->
  <path d="M 300 90 L 510 90 L 510 270 L 440 270 L 440 250 L 300 250 Z" fill="#d97706" stroke="#0f172a" stroke-width="2"/>
  <text x="415" y="175" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">通孔金屬 (Via)</text>

  <!-- 微影開口偏離標示 (頂部) -->
  <line x1="300" y1="75" x2="510" y2="75" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="300" y1="70" x2="300" y2="90" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="510" y1="70" x2="510" y2="90" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="405" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">微影通孔開口（產生橫向疊對偏移）</text>

  <!-- 微影偏移中心對比理想位置虛線 -->
  <line x1="520" y1="75" x2="520" y2="105" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="525" y="86" text-anchor="start" font-family="sans-serif" font-size="14" fill="#0f172a">目標對準中心</text>

  <!-- 6. 製程機理註解與箭頭 -->
  <!-- 標籤 A：硬遮罩阻擋 -->
  <line x1="220" y1="165" x2="350" y2="245" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="155" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">高選擇比介電硬遮罩阻擋蝕刻</text>
  <text x="210" y="175" text-anchor="end" font-family="sans-serif" font-size="14" fill="#0f172a">蝕刻在此終止，不向下穿透</text>

  <!-- 標籤 B：絕緣無短路標記 -->
  <line x1="160" y1="220" x2="235" y2="255" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="215" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">相鄰導線受保護（無短路）</text>
  <text x="150" y="235" text-anchor="end" font-family="sans-serif" font-size="14" fill="#0f172a">維持安全電氣絕緣間距</text>

  <!-- 標籤 C：底部自對準接觸面 -->
  <line x1="440" y1="410" x2="440" y2="278" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">底部邊界自對準目標金屬邊緣</text>

  <!-- 7. 材料層右側圖例與標籤 -->
  <line x1="660" y1="170" x2="690" y2="170" stroke="#0f172a" stroke-width="1.5"/>
  <text x="695" y="175" font-family="sans-serif" font-size="14" fill="#0f172a">層間介電層 (Low-k ILD)</text>

  <line x1="660" y1="260" x2="690" y2="260" stroke="#0f172a" stroke-width="1.5"/>
  <text x="695" y="265" font-family="sans-serif" font-size="14" fill="#0f172a">介電硬遮罩 (Dielectric Hardmask)</text>
</svg>