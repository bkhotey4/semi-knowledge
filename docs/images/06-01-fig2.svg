  <path d="M 50 120 L 300 120 L 300 400 L 500 400 L 500 120 L 750 120 L 750 135 L 515 135 L 515 400 L 285 400 L 285 135 L 50 135 Z" fill="#b87333" opacity="0.3"/>
  <path d="M 300 400 L 500 400 L 500 340 L 315 340 L 315 400 Z" fill="#b87333"/>
  <path d="M 300 400 L 315 400 L 315 120 L 300 120 Z" fill="#b87333"/>
  <path d="M 485 400 L 500 400 L 500 120 L 485 120 Z" fill="#b87333"/>
  <circle cx="80" cy="110" r="8" fill="#0055ff"/>
  <circle cx="120" cy="110" r="8" fill="#0055ff"/>
  <circle cx="160" cy="110" r="8" fill="#0055ff"/>
  <circle cx="280" cy="110" r="8" fill="#0055ff"/>
  <circle cx="305" cy="130" r="8" fill="#0055ff"/>
  <circle cx="520" cy="110" r="8" fill="#0055ff"/>
  <circle cx="495" cy="130" r="8" fill="#0055ff"/>
  <circle cx="600" cy="110" r="8" fill="#0055ff"/>
  <circle cx="350" cy="385" r="4" fill="#ff0000"/>
