  <text x="325" y="250" font-family="sans-serif" font-size="14" fill="#b87333">Bottom-up Growth</text>
  <text x="520" y="155" font-family="sans-serif" font-size="14" fill="#b87333">銅晶種層 (Cu Seed)</text>
  <line x1="515" y1="150" x2="502" y2="150" stroke="#b87333" stroke-width="1"/>
