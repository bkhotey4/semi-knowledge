  <line x1="325" y1="250" x2="345" y2="250" stroke="#b87333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="250" x2="455" y2="250" stroke="#b87333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="340" y="60" font-family="sans-serif" font-size="18" fill="#000000">電解液 (Electrolyte)</text>
