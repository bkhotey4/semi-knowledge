  <line x1="580" y1="286" x2="650" y2="286" stroke="#000000" stroke-width="1"/>
  <text x="655" y="290" font-family="sans-serif" font-size="16" fill="#000000">矽奈米片通道</text>

  <path d="M 260 210 L 200 120" stroke="#000000" stroke-width="1" fill="none"/>
  <text x="130" y="115" font-family="sans-serif" font-size="16" fill="#000000">內部間隔層 (Inner Spacer)</text>

  <text x="310" y="335" font-family="sans-serif" font-size="14" fill="#444444">全環繞閘極控制 (GAA)</text>
  
  <rect x="300" y="100" width="200" height="30" fill="#f5a623"/>
  <text x="365" y="120" font-family="sans-serif" font-size="14" fill="#000000">閘極頂部</text>
