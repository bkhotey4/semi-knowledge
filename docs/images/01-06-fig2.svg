  <text x="125" y="345" font-family="sans-serif" font-size="14" fill="#ffffff">(Source)</text>

  <rect x="580" y="150" width="120" height="200" fill="#4a90e2" opacity="0.8"/>
  <text x="610" y="330" font-family="sans-serif" font-size="18" fill="#ffffff" font-weight="bold">汲極</text>
  <text x="605" y="345" font-family="sans-serif" font-size="14" fill="#ffffff">(Drain)</text>

  <rect x="220" y="180" width="360" height="12" fill="#4a90e2"/>
  <rect x="220" y="230" width="360" height="12" fill="#4a90e2"/>
  <rect x="220" y="280" width="360" height="12" fill="#4a90e2"/>

  <rect x="300" y="100" width="200" height="250" fill="#f5a623" opacity="0.6"/>
  <rect x="300" y="192" width="200" height="38" fill="#f5a623" opacity="0.9"/>
  <rect x="300" y="242" width="200" height="38" fill="#f5a623" opacity="0.9"/>
  
  <rect x="220" y="192" width="80" height="38" fill="#7ed321"/>
  <rect x="500" y="192" width="80" height="38" fill="#7ed321"/>
  <rect x="220" y="242" width="80" height="38" fill="#7ed321"/>
  <rect x="500" y="242" width="80" height="38" fill="#7ed321"/>

  <line x1="240" y1="186" x2="560" y2="186" stroke="#d0021b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="236" x2="560" y2="236" stroke="#d0021b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="286" x2="560" y2="286" stroke="#d0021b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="175" font-family="sans-serif" font-size="14" fill="#d0021b">電流方向 (Ids)</text>

  <line x1="400" y1="100" x2="400" y2="60" stroke="#000000" stroke-width="1"/>
