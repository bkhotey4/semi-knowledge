  <polygon points="700,250 470,250 445,285 470,320 700,320" fill="#b0c4de" stroke="#707070" stroke-width="1"/>
  
  <rect x="360" y="180" width="80" height="70" fill="#a0a0a0" stroke="#707070" stroke-width="1"/>
  
  <rect x="330" y="180" width="30" height="70" fill="#d0d0d0" stroke="#707070" stroke-width="1"/>
  <rect x="440" y="180" width="30" height="70" fill="#d0d0d0" stroke="#707070" stroke-width="1"/>
  
  <path d="M 50,250 L 325,250 L 325,175 L 475,175 L 475,250 L 750,250" fill="none" stroke="#ffd700" stroke-width="4"/>
  
  <line x1="355" y1="285" x2="385" y2="285" stroke="#707070" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="445" y1="285" x2="415" y2="285" stroke="#707070" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <text x="400" y="310" font-family="sans-serif" font-size="16" fill="#707070" text-anchor="middle">應變通道</text>
