t="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">透過邊緣運算與雙軌通訊，實現高精度、低延遲的智慧化生產管理。</text></svg>