<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
    <marker id="blackarrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <text x="400" y="40" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">應變矽晶格結構與能帶分裂示意圖</text>

  <line x1="80" y1="280" x2="420" y2="280" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="250" y="275" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">異質界面 (Hetero-interface)</text>

  <g id="SiGe_Lattice">
    <line x1="100" y1="300" x2="400" y2="300" stroke="#808080" stroke-width="1"/>
    <line x1="100" y1="340" x2="400" y2="340" stroke="#808080" stroke-width="1"/>
    <line x1="100" y1="380" x2="400" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="100" y1="300" x2="100" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="150" y1="300" x2="150" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="200" y1="300" x2="200" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="250" y1="300" x2="250" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="300" y1="300" x2="300" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="350" y1="300" x2="350" y2="380" stroke="#808080" stroke-width="1"/>
    <line x1="400" y1="300" x2="400" y2="380" stroke="#808080" stroke-width="1"/>
    
    <circle cx="100" cy="300" r="5" fill="#808080"/><circle cx="150" cy="300" r="5" fill="#808080"/><circle cx="200" cy="300" r="5" fill="#808080"/><circle cx="250" cy="300" r="5" fill="#808080"/><circle cx="300" cy="300" r="5" fill="#808080"/><circle cx="350" cy="300" r="5" fill="#808080"/><circle cx="400" cy="300" r="5" fill="#808080"/>
    <circle cx="100" cy="340" r="5" fill="#808080"/><circle cx="150" cy="340" r="5" fill="#808080"/><circle cx="200" cy="340" r="5" fill="#808080"/><circle cx="250" cy="340" r="5" fill="#808080"/><circle cx="300" cy="340" r="5" fill="#808080"/><circle cx="350" cy="340" r="5" fill="#808080"/><circle cx="400" cy="340" r="5" fill="#808080"/>
    <circle cx="100" cy="380" r="5" fill="#808080"/><circle cx="150" cy="380" r="5" fill="#808080"/><circle cx="200" cy="380" r="5" fill="#808080"/><circle cx="250" cy="380" r="5" fill="#808080"/><circle cx="300" cy="380" r="5" fill="#808080"/><circle cx="350" cy="380" r="5" fill="#808080"/><circle cx="400" cy="380" r="5" fill="#808080"/>
  </g>
  <text x="250" y="410" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#808080">矽鍺緩衝層 (Relaxed SiGe)</text>
  <text x="250" y="430" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#808080">晶格常數較大 (a_SiGe)</text>

  <g id="Strained_Si">
    <line x1="100" y1="210" x2="400" y2="210" stroke="#0000ff" stroke-width="1"/>
    <line x1="100" y1="245" x2="400" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="100" y1="210" x2="100" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="150" y1="210" x2="150" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="200" y1="210" x2="200" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="250" y1="210" x2="250" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="300" y1="210" x2="300" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="350" y1="210" x2="350" y2="245" stroke="#0000ff" stroke-width="1"/>
    <line x1="400" y1="210" x2="400" y2="245" stroke="#0000ff" stroke-width="1"/>

    <circle cx="100" cy="210" r="5" fill="#0000ff"/><circle cx="150" cy="210" r="5" fill="#0000ff"/><circle cx="200" cy="210" r="5" fill="#0000ff"/><circle cx="250" cy="210" r="5" fill="#0000ff"/><circle cx="300" cy="210" r="5" fill="#0000ff"/><circle cx="350" cy="210" r="5" fill="#0000ff"/><circle cx="400" cy="210" r="5" fill="#0000ff"/>
    <circle cx="100" cy="245" r="5" fill="#0000ff"/><circle cx="150" cy="245" r="5" fill="#0000ff"/><circle cx="200" cy="245" r="5" fill="#0000ff"/><circle cx="250" cy="245" r="5" fill="#0000ff"/><circle cx="300" cy="245" r="5" fill="#0000ff"/><circle cx="350" cy="245" r="5" fill="#0000ff"/><circle cx="400" cy="245" r="5" fill="#0000ff"/>
  </g>
  <text x="250" y="150" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#0000ff">磊晶矽層 (Strained Si)</text>
  <text x="250" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0000ff">晶格受拉伸對齊 (a_Si &lt; a_SiGe)</text>

  <line x1="160" y1="227" x2="110" y2="227" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="227" x2="390" y2="227" stroke="#ff0000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="225" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ff0000" font-weight="bold">張應力 (Tensile Strain)</text>

  <line x1="520" y1="350" x2="520" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#blackarrow)"/>
  <text x="510" y="90" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">能量 (E)</text>

  <line x1="550" y1="220" x2="630" y2="220" stroke="#000000" stroke-width="3"/>
  <text x="590" y="240" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">未應變矽</text>
  <text x="590" y="210" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">Δ6 (簡併態)</text>

  <line x1="680" y1="160" x2="760" y2="160" stroke="#ff0000" stroke-width="2"/>
  <text x="770" y="165" font-family="sans-serif" font-size="14" text-anchor="start" fill="#ff0000">Δ4 能谷 (上升)</text>
  
  <line x1="680" y1="280" x2="760" y2="280" stroke="#0000ff" stroke-width="2"/>
  <text x="770" y="285" font-family="sans-serif" font-size="14" text-anchor="start" fill="#0000ff">Δ2 能谷 (下降)</text>

  <path d="M 640 220 Q 660 220 670 170" fill="none" stroke="#808080" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#blackarrow)"/>
  <path d="M 640 220 Q 660 220 670 270" fill="none" stroke="#808080" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#blackarrow)"/>
  <text x="720" y="320" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000" font-weight="bold">能帶分裂 (Splitting)</text>

  <line x1="720" y1="170" x2="720" y2="270" stroke="#000000" stroke-width="1" marker-start="url(#blackarrow)" marker-end="url(#blackarrow)"/>
  <text x="730" y="225" font-family="sans-serif" font-size="14" text-anchor="start" fill="#000000">ΔEc</text>
</svg>