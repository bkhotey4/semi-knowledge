 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">ISO 14644-1 微粒濃度上限</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 55 章　廠務系統總覽與無塵室</text><text x="480" y="180" font-size="46" fill="#37474f" font-weight="bold" text-anchor="middle">Cn = 10^N · (0.1 / D)^2.2</text><text x="70" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Cn</text><text x="180" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">每立方公尺大於等於 D 之最大微粒濃</text><text x="180" y="276.1" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">度 (pcs/m³)</text><text x="510" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">N</text><text x="620" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">ISO 潔淨度等級數值 (1 至 9)</text><text x="70" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">D</text><text x="180" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">考量之微粒粒徑臨界值 (μm)</text><text x="510" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">0.1</text><text x="620" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">參考基準粒徑 (μm)</text><text x="480" y="430" font-size="17" fill="#5f6b7a" font-weight="normal" text-anchor="middle">適用粒徑 0.1 μm ≤ D ≤ 5.0 μm，計算結果無條件捨去至整數</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">公制連續冪次公式精確定量不同潔淨等級下的微粒粒徑分佈上限</text></svg>