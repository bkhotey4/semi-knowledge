<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- 定義箭頭 -->
  <defs>
    <marker id="arrow_blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0055AA" />
    </marker>
    <marker id="arrow_red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#CC0000" />
    </marker>
    <marker id="arrow_black" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#000000" />
    </marker>
  </defs>

  <!-- 頂層：大數據分析平台 -->
  <rect x="450" y="20" width="280" height="60" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
  <text x="590" y="55" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">大數據分析平台</text>

  <!-- 中層：MES 與 EAP -->
  <rect x="70" y="110" width="280" height="60" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
  <text x="210" y="145" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">製造執行系統 (MES)</text>
  
  <rect x="450" y="110" width="280" height="60" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
  <text x="590" y="145" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">設備自動化程式 (EAP)</text>

  <!-- 介面層：機台通訊伺服器 -->
  <rect x="70" y="210" width="660" height="80" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
  <text x="400" y="230" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">機台通訊伺服器 (Communication Server)</text>
  
  <!-- 內部介面方塊 -->
  <rect x="100" y="240" width="250" height="40" rx="3" fill="#ffffff" stroke="#000000" stroke-dasharray="4"/>
  <text x="225" y="265" font-family="sans-serif" font-size="14" text-anchor="middle">SECS/GEM 介面 (E30/E37)</text>
  
  <rect x="450" y="240" width="250" height="40" rx="3" fill="#ffffff" stroke="#000000" stroke-dasharray="4"/>
  <text x="575" y="265" font-family="sans-serif" font-size="14" text-anchor="middle">EDA / Interface A (E134)</text>

  <!-- 底部：實體製程設備 -->
  <rect x="70" y="340" width="660" height="90" rx="5" fill="#f4f4f4" stroke="#000000" stroke-width="2"/>
  <text x="400" y="360" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">實體製程設備 (Equipment)</text>
  
  <rect x="100" y="375" width="250" height="40" rx="3" fill="#ffffff" stroke="#000000"/>
  <text x="225" y="400" font-family="sans-serif" font-size="14" text-anchor="middle">可程式邏輯控制器 (PLC)</text>
  
  <rect x="450" y="375" width="250" height="40" rx="3" fill="#ffffff" stroke="#000000"/>
  <text x="575" y="400" font-family="sans-serif" font-size="14" text-anchor="middle">高頻感測器 (Sensors)</text>

  <!-- 連線：控制流 (藍色雙向) -->
  <line x1="210" y1="110" x2="210" y2="80" stroke="#0055AA" stroke-width="2" marker-end="url(#arrow_blue)" marker-start="url(#arrow_blue)"/>
  <line x1="350" y1="140" x2="450" y2="140" stroke="#0055AA" stroke-width="2" marker-end="url(#arrow_blue)" marker-start="url(#arrow_blue)"/>
  <line x1="590" y1="170" x2="590" y2="210" stroke="#0055AA" stroke-width="2" marker-end="url(#arrow_blue)" marker-start="url(#arrow_blue)"/>
  <path d="M 225 210 L 225 170" fill="none" stroke="#0055AA" stroke-width="2" marker-end="url(#arrow_blue)" marker-start="url(#arrow_blue)"/>
  <line x1="225" y1="280" x2="225" y2="375" stroke="#0055AA" stroke-width="2" marker-end="url(#arrow_blue)" marker-start="url(#arrow_blue)"/>

  <!-- 連線：資料流 (紅色單向向上) -->
  <line x1="575" y1="375" x2="575" y2="280" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow_red)"/>
  <line x1="575" y1="210" x2="575" y2="80" stroke="#CC0000" stroke-width="2" marker-end="url(#arrow_red)"/>

  <!-- 標籤文字 -->
  <text x="360" y="135" font-family="sans-serif" font-size="14" fill="#0055AA">雙向控制命令</text>
  <text x="600" y="320" font-family="sans-serif" font-size="14" fill="#CC0000">單向上報資料</text>
  <text x="600" y="195" font-family="sans-serif" font-size="14" fill="#CC0000">高頻數據流</text>
  <text x="110" y="320" font-family="sans-serif" font-size="14" fill="#0055AA">狀態回報與指令</text>
</svg>