 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">光罩與計算微影核心</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 16 章　光罩、Pellicle 與計算微影</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">DUV 採石英穿透式光罩，EUV 採 ULE 玻璃與 Mo/Si 多層膜之反射式架</text><text x="100" y="186.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">構。</text><circle cx="64" cy="253.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="261.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">EUV 防塵薄膜處高真空僅能靠熱輻射散熱，碳奈米管網絡為高功率首選。</text><circle cx="64" cy="328.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="336.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="336.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">Model-based OPC 與 SRAF 藉同調干涉抵消繞射效應，壓抑邊緣放置誤</text><text x="100" y="372.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">差。</text><circle cx="64" cy="439.5" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="447.5" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="447.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">反向微影技術求解最佳穿透率，搭配多電子束直寫實現曲面光罩量產。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">整合精密光罩材料、光學物理模型與數值演算法，突破次波長微影極限。</text></svg>