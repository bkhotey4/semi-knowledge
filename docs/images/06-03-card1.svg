<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><defs><marker id="ar-00796b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker><marker id="ar-1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ar-2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar-37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar-3f51b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="ar-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="ar-6a1b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="ar-90a4ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker><marker id="ar-c62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ar-e65100" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker></defs><rect x="1" y="1" width="958" height="598" rx="24" fill="#ffffff" stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">接觸通孔與新金屬複習</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 31 章　接觸、通孔與新導線金屬</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">微縮致接觸電阻非線性劇增，金屬與半導體介面比接觸電阻率成為主要效</text><text x="100" y="186.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">能瓶頸。</text><circle cx="64" cy="253.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="261.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">導線線寬小於電子平均自由路徑時，散射效應使有效電阻率劇升，促使導</text><text x="100" y="297.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">入鈷釕鉬。</text><circle cx="64" cy="364.5" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="372.5" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="372.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">自對準通孔技術利用材料蝕刻選擇比與硬遮罩，克服微影疊對誤差並提高</text><text x="100" y="408.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">佈局密度。</text><circle cx="64" cy="475.75" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="483.75" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="483.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">減法式金屬蝕刻直接切割新型金屬，消除厚阻障層並可整合氣隙以降寄生</text><text x="100" y="520.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">電容。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">新導線材料、自對準架構與減法蝕刻是突破埃米世代互連瓶頸的核心技術。</text></svg>