 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">電子級矽與單晶成長</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 7 章　電子級矽與單晶成長</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">西門子製程將粗矽轉為三氯矽烷精餾，沉積成 11N 純度之電子級多晶矽</text><text x="100" y="186.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">。</text><circle cx="64" cy="253.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="261.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">柴氏長晶法以 Dash 縮頸技術消除位錯，為積體電路矽錠主流製程。</text><circle cx="64" cy="328.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="336.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="336.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">浮區法無坩堝接觸，具備極高電阻率與極低氧含量，專攻高壓功率元件。</text><circle cx="64" cy="403.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="411.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="411.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">伏隆可夫準則調控 v/G 比值抑制原生缺陷，經階梯退火實現內部吸雜。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">精準控制純化化學與結晶熱流場，方能產出無缺陷之半導體級單晶基板。</text></svg>