 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">2.5D 封裝與 CoWoS 核心觀念</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 38 章　2.5D 封裝與 CoWoS</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">透過矽中介層異質整合小晶片，突破單一晶粒光罩極限並提升製造良率。</text><circle cx="64" cy="217.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="225.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="225.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">縮短處理器與 HBM 間互連距離至微米級，有效克服記憶體牆之頻寬瓶頸</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">。</text><circle cx="64" cy="328.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="336.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="336.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">利用半導體前段製程製作高密度重佈線層，實現亞微米級之線寬線距佈線</text><text x="100" y="372.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">。</text><circle cx="64" cy="439.5" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="447.5" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="447.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">包含 S、R、L 三種架構，分別針對密度、成本與大尺寸需求提供解決方</text><text x="100" y="483.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">案。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">以中介層實現異質整合，為高效能運算突破物理尺寸與資料傳輸頻寬之限制。</text></svg>