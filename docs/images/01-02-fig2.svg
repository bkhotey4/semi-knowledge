<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 圖名與說明 -->
  <text x="400" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">載子漂移與晶格散射軌跡示意圖</text>

  <!-- 外加電場指示條 -->
  <line x1="260" y1="65" x2="540" y2="65" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="400" y="58" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">外加電場 E (向右)</text>

  <!-- 電子受力方向指示 -->
  <line x1="540" y1="88" x2="260" y2="88" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="400" y="105" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">電子受靜電力 F = -qE (向左加速)</text>

  <!-- 背景電場線（淡色） -->
  <line x1="90" y1="150" x2="710" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
  <line x1="90" y1="225" x2="710" y2="225" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
  <line x1="90" y1="300" x2="710" y2="300" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
  <line x1="90" y1="365" x2="710" y2="365" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

  <!-- 晶格原子陣列 -->
  <!-- Row 1: y=150 -->
  <circle cx="120" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="200" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="280" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="360" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="440" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="520" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="600" cy="150" r="9" fill="#94a3b8"/>
  <circle cx="680" cy="150" r="9" fill="#94a3b8"/>

  <!-- Row 2: y=225 -->
  <circle cx="120" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="200" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="280" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="360" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="440" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="520" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="600" cy="225" r="9" fill="#94a3b8"/>
  <circle cx="680" cy="225" r="9" fill="#94a3b8"/>

  <!-- Row 3: y=300 -->
  <circle cx="120" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="200" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="280" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="360" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="440" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="520" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="600" cy="300" r="9" fill="#94a3b8"/>
  <circle cx="680" cy="300" r="9" fill="#94a3b8"/>

  <!-- Row 4: y=365 -->
  <circle cx="120" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="200" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="280" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="360" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="440" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="520" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="600" cy="365" r="9" fill="#94a3b8"/>
  <circle cx="680" cy="365" r="9" fill="#94a3b8"/>

  <!-- 晶格原子標示 -->
  <text x="680" y="132" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">晶格原子</text>

  <!-- 電子熱運動與散射軌跡 -->
  <!-- 軌跡折線 -->
  <path d="M 660 215 
           Q 632 178 600 150 
           Q 558 182 520 225 
           Q 528 266 535 295 
           Q 485 296 440 300 
           Q 395 250 360 225 
           Q 322 258 280 300 
           Q 238 262 200 225 
           Q 175 235 150 240" 
        fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- 散射點記號（擴散圈） -->
  <circle cx="600" cy="150" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="520" cy="225" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="440" cy="300" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="360" cy="225" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="280" cy="300" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="200" cy="225" r="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- 電子起點與終點 -->
  <circle cx="660" cy="215" r="6" fill="#dc2626"/>
  <text x="672" y="212" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">起點</text>

  <circle cx="150" cy="240" r="6" fill="#dc2626"/>
  <text x="135" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">終點</text>

  <!-- 散射標籤指引 -->
  <line x1="520" y1="211" x2="520" y2="175" stroke="#1e293b" stroke-width="1"/>
  <text x="520" y="170" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">晶格散射點</text>

  <line x1="395" y1="240" x2="395" y2="195" stroke="#1e293b" stroke-width="1"/>
  <text x="395" y="190" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">熱運動折線 (v_th ≈ 10⁷ cm/s)</text>

  <!-- 漂移速度與淨位移投影基準線 -->
  <line x1="660" y1="225" x2="660" y2="422" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="150" y1="248" x2="150" y2="422" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- 淨漂移向量 -->
  <line x1="660" y1="412" x2="155" y2="412" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="405" y="404" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">淨漂移速度 vd (向左累積淨位移)</text>
</svg>