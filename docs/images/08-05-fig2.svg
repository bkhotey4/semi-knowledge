<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orientation="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
    </marker>
  </defs>

  <text x="400" y="50" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">共同封裝光學 (CPO) 架構示意圖</text>

  <rect x="100" y="340" width="600" height="50" fill="#e0e0e0" stroke="#000000" stroke-width="1.5"/>
  <text x="400" y="375" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">高密度封裝基板 (High-Density Substrate)</text>

  <circle cx="340" cy="320" r="6" fill="#000000"/>
  <circle cx="370" cy="320" r="6" fill="#000000"/>
  <circle cx="400" cy="320" r="6" fill="#000000"/>
  <circle cx="430" cy="320" r="6" fill="#000000"/>
  <circle cx="460" cy="320" r="6" fill="#000000"/>
  
  <circle cx="160" cy="320" r="6" fill="#000000"/>
  <circle cx="190" cy="320" r="6" fill="#000000"/>
  <circle cx="220" cy="320" r="6" fill="#000000"/>
  
  <circle cx="580" cy="320" r="6" fill="#000000"/>
  <circle cx="610" cy="320" r="6" fill="#000000"/>
  <circle cx="640" cy="320" r="6" fill="#000000"/>

  <line x1="480" y1="320" x2="520" y2="320" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="525" y="325" font-family="sans-serif" font-size="14" fill="#000000">微凸塊 (Micro-bumps)</text>

  <rect x="320" y="160" width="160" height="140" fill="#bbdefb" stroke="#000000" stroke-width="2"/>
  <text x="400" y="235" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">ASIC 邏輯晶片</text>

  <rect x="130" y="200" width="120" height="100" fill="#c8e6c9" stroke="#000000" stroke-width="2"/>
  <text x="190" y="255" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">矽光子引擎 (OE)</text>

  <rect x="550" y="200" width="120" height="100" fill="#c8e6c9" stroke="#000000" stroke-width="2"/>
  <text x="610" y="255" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">矽光子引擎 (OE)</text>

  <rect x="10" y="240" width="120" height="20" fill="#ffffff" stroke="#000000" stroke-dasharray="4"/>
  <rect x="670" y="240" width="120" height="20" fill="#ffffff" stroke="#000000" stroke-dasharray="4"/>
  <text x="70" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">光纖陣列 (FA)</text>
  <text x="730" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">光纖陣列 (FA)</text>

  <path d="M320 210 L255 210" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M255 225 L320 225" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="288" y="195" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">電訊號 (&lt; 1 cm)</text>

  <path d="M130 250 L30 250" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="80" y="275" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">光訊號路徑</text>

  <path d="M670 250 L770 250" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="720" y="275" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">光訊號路徑</text>
</svg>