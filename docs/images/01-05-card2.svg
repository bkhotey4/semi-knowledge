 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">次臨界擺幅方程式</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 5 章　微縮定律與短通道效應</text><text x="480" y="180" font-size="34" fill="#37474f" font-weight="bold" text-anchor="middle">S = ln(10)·(kB·T/q)·[1 + (Cdep + Cit)/C…</text><text x="70" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">S</text><text x="180" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">次臨界擺幅（mV/dec）</text><text x="510" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">kB·T/q</text><text x="620" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">熱電壓，室溫約 25.9 mV</text><text x="70" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Cox</text><text x="180" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">閘極介電層單位面積電容</text><text x="510" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Cdep</text><text x="620" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">基板通道空乏層電容</text><text x="70" y="354" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Cit</text><text x="180" y="354.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">半導體介面陷阱態電容</text><text x="480" y="430" font-size="17" fill="#5f6b7a" font-weight="normal" text-anchor="middle">室溫 300 K 理想極限約為 60 mV/dec，是擴散載子之熱力學下限。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">次臨界擺幅極限鎖死臨界電壓調降空間，造成待機漏電劇增與Dennard失效。</text></svg>