<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>
  
  <!-- 數據採集 -->
  <rect x="310" y="20" width="180" height="45" rx="5" fill="#e3f2fd" stroke="#333333" stroke-width="2"/>
  <text x="400" y="48" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">數據採集</text>
  
  <!-- 管制界限判定 -->
  <polygon points="400,85 560,130 400,175 240,130" fill="#fff9c4" stroke="#333333" stroke-width="2"/>
  <text x="400" y="125" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">管制界限與</text>
  <text x="400" y="145" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">Western Electric 判定</text>
  
  <!-- OOC 處置 -->
  <rect x="40" y="110" width="180" height="45" rx="5" fill="#ffebee" stroke="#333333" stroke-width="2"/>
  <text x="130" y="130" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">OOC 處置與</text>
  <text x="130" y="150" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">OCAP 流程</text>
  
  <!-- 規格界限判定 -->
  <polygon points="400,205 560,250 400,295 240,250" fill="#fff9c4" stroke="#333333" stroke-width="2"/>
  <text x="400" y="245" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">規格界限 (USL/LSL)</text>
  <text x="400" y="265" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">判定</text>
  
  <!-- OOS 處置 -->
  <rect x="580" y="225" width="180" height="50" rx="5" fill="#ffebee" stroke="#333333" stroke-width="2"/>
  <text x="670" y="248" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">OOS 產品隔離</text>
  <text x="670" y="268" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#000000">與報廢評估</text>
  
  <!-- RCA 流程 -->
  <rect x="310" y="340" width="180" height="45" rx="5" fill="#e3f2fd" stroke="#333333" stroke-width="2"/>
  <text x="400" y="368" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">根本原因分析 (RCA)</text>
  
  <!-- 連接線與箭頭 -->
  <line x1="400" y1="65" x2="400" y2="85" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- OOC 分支 -->
  <line x1="240" y1="130" x2="220" y2="130" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="120" font-family="sans-serif" font-size="14" fill="#d32f2f">觸發 OOC</text>
  
  <!-- 正常回饋分支 -->
  <path d="M560,130 L770,130 L770,42 L490,42" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="120" font-family="sans-serif" font-size="14" fill="#388e3c">否 (管制內)</text>
  
  <!-- 進入規格判定 -->
  <line x1="400" y1="175" x2="400" y2="205" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- OOS 分支 -->
  <line x1="560" y1="250" x2="580" y2="250" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="240" font-family="sans-serif" font-size="14" fill="#d32f2f">是 (OOS)</text>
  
  <!-- 規格內但 OOC -->
  <line x1="400" y1="295" x2="400" y2="340" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="320" font-family="sans-serif" font-size="14" fill="#333333">否 (規格內)</text>
  
  <!-- 最終回饋 -->
  <path d="M400,385 L400,420 L20,420 L20,42 L310,42" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="160" y="410" font-family="sans-serif" font-size="14" fill="#333333">製程調整與水平展開回饋</text>
</svg>