<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 中央區域分隔虛線 -->
  <line x1="395" y1="25" x2="395" y2="425" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- ==================== (a) 直接穿隧 (Direct Tunneling) ==================== -->
  <text x="195" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">（一）直接穿隧（梯形能障）</text>
  <text x="195" y="66" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">弱電場條件：qV_ox &lt; Φ_B，穿透全厚度</text>

  <!-- 材料分區底色與標籤 -->
  <rect x="40" y="85" width="85" height="260" fill="#e2e8f0" opacity="0.4"/>
  <rect x="125" y="85" width="105" height="260" fill="#e2e8f0" opacity="0.8"/>
  <text x="82" y="105" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">金屬閘極</text>
  <text x="177" y="105" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">介電層</text>
  <text x="290" y="105" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">矽基板 / 通道</text>

  <!-- 介電層梯形能障 (傳導帶 Ec) -->
  <polygon points="125,140 230,195 230,345 125,345" fill="#e2e8f0" opacity="0.9"/>
  <line x1="125" y1="140" x2="230" y2="195" stroke="#0284c7" stroke-width="3"/>
  <text x="180" y="155" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_c (介電層)</text>

  <!-- 金屬費米能階 E_F,m -->
  <line x1="45" y1="230" x2="125" y2="230" stroke="#0284c7" stroke-width="2.5"/>
  <text x="75" y="222" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_F,m</text>

  <!-- 矽基板能階 -->
  <path d="M 230,260 Q 275,275 350,275" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <text x="315" y="265" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_c (Si)</text>
  <line x1="230" y1="295" x2="350" y2="295" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="315" y="315" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_F,s</text>

  <!-- 能障高度 Φ_B 標記 -->
  <line x1="115" y1="143" x2="115" y2="227" stroke="#1e293b" stroke-width="1.5" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="100" y="190" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="end">Φ_B</text>

  <!-- 直接穿隧路徑 (穿透整個物理厚度 t_ox) -->
  <line x1="105" y1="230" x2="235" y2="230" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <circle cx="100" cy="230" r="4.5" fill="#dc2626"/>
  <text x="175" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">直接穿隧路徑</text>

  <!-- 物理厚度 t_ox 標記 -->
  <line x1="125" y1="365" x2="230" y2="365" stroke="#1e293b" stroke-width="1.5" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="177" y="385" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">物理厚度 t_ox</text>

  <!-- ==================== (b) FN 穿隧 (Fowler-Nordheim) ==================== -->
  <text x="595" y="42" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">（二）FN 穿隧（三角形能障）</text>
  <text x="595" y="66" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">強電場條件：qV_ox &gt; Φ_B，穿透部分能障</text>

  <!-- 材料分區底色與標籤 -->
  <rect x="435" y="85" width="85" height="260" fill="#e2e8f0" opacity="0.4"/>
  <rect x="520" y="85" width="130" height="260" fill="#e2e8f0" opacity="0.8"/>
  <text x="477" y="105" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">金屬閘極</text>
  <text x="585" y="105" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">介電層</text>
  <text x="705" y="105" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">矽基板 / 通道</text>

  <!-- 介電層三角形能障 (傳導帶 Ec 急遽傾斜) -->
  <polygon points="520,120 650,315 650,345 520,345" fill="#e2e8f0" opacity="0.9"/>
  <line x1="520" y1="120" x2="650" y2="315" stroke="#0284c7" stroke-width="3"/>
  <text x="615" y="170" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_c (介電層)</text>

  <!-- 金屬費米能階 E_F,m -->
  <line x1="440" y1="210" x2="520" y2="210" stroke="#0284c7" stroke-width="2.5"/>
  <text x="470" y="202" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_F,m</text>

  <!-- 矽基板能階 -->
  <path d="M 650,325 Q 685,335 755,335" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <text x="715" y="325" font-family="sans-serif" font-size="14" fill="#0284c7" text-anchor="middle">E_c (Si)</text>

  <!-- 能障高度 Φ_B 標記 -->
  <line x1="510" y1="123" x2="510" y2="207" stroke="#1e293b" stroke-width="1.5" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="495" y="170" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="end">Φ_B</text>

  <!-- FN 穿隧路徑 (穿隧至介電層導帶後漂移) -->
  <!-- 穿隧交點位於 X = 520 + (210 - 120)/(315 - 120) * 130 = 580 -->
  <line x1="500" y1="210" x2="583" y2="210" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)"/>
  <circle cx="495" cy="210" r="4.5" fill="#dc2626"/>
  <path d="M 585,218 L 645,308" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="548" y="198" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">FN 穿隧路徑</text>
  <text x="635" y="255" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="start">導帶漂移</text>

  <!-- 有效穿隧距離 x_t 與總厚度 t_ox -->
  <line x1="520" y1="365" x2="580" y2="365" stroke="#dc2626" stroke-width="1.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="550" y="385" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">有效距離 x_t</text>

  <line x1="520" y1="405" x2="650" y2="405" stroke="#1e293b" stroke-width="1.5" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="585" y="425" font-family="sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">物理厚度 t_ox</text>

  <!-- 底部公共說明：載子移動與漏電流方向 -->
  <line x1="90" y1="415" x2="155" y2="415" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="165" y="420" font-family="sans-serif" font-size="14" fill="#dc2626">載子（電子）移動方向</text>

  <line x1="330" y1="415" x2="265" y2="415" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="340" y="420" font-family="sans-serif" font-size="14" fill="#1e293b">穿隧漏電流方向 J_g</text>
</svg>