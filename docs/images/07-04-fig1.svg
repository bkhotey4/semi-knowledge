<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f7f7f" />
    </marker>
  </defs>
  
  <!-- 座標軸 -->
  <line x1="100" y1="380" x2="750" y2="380" stroke="#000000" stroke-width="2"/>
  <text x="680" y="410" font-family="sans-serif" font-size="16" fill="#000000">製程參數值</text>
  
  <!-- 規格界限 (LSL, USL, Target) -->
  <line x1="200" y1="80" x2="200" y2="380" stroke="#d62728" stroke-width="2" stroke-dasharray="4"/>
  <line x1="600" y1="80" x2="600" y2="380" stroke="#d62728" stroke-width="2" stroke-dasharray="4"/>
  <line x1="400" y1="80" x2="400" y2="380" stroke="#7f7f7f" stroke-width="1" stroke-dasharray="2"/>
  
  <text x="150" y="400" font-family="sans-serif" font-size="16" fill="#d62728">規格下限 (LSL)</text>
  <text x="560" y="400" font-family="sans-serif" font-size="16" fill="#d62728">規格上限 (USL)</text>
  <text x="355" y="400" font-family="sans-serif" font-size="16" fill="#7f7f7f">規格中心 (T)</text>
  
  <!-- 常態分佈曲線 (中心偏移至 450) -->
  <path d="M 310 380 C 370 380 400 100 450 100 C 500 100 530 380 590 380" fill="none" stroke="#1f77b4" stroke-width="3"/>
  <line x1="450" y1="100" x2="450" y2="380" stroke="#1f77b4" stroke-width="2"/>
  <text x="435" y="90" font-family="sans-serif" font-size="16" fill="#1f77b4">平均值 (μ)</text>
  
  <!-- Cp 示意：規格寬度與 6σ 寬度 -->
  <line x1="200" y1="330" x2="600" y2="330" stroke="#7f7f7f" stroke-width="1.5" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text x="330" y="320" font-family="sans-serif" font-size="14" fill="#7f7f7f">規格寬度 (USL - LSL)</text>
  
  <line x1="330" y1="260" x2="570" y2="260" stroke="#7f7f7f" stroke-width="1.5" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text x="390" y="250" font-family="sans-serif" font-size="14" fill="#7f7f7f">自然寬度 (6σ)</text>
  
  <!-- Ca 示意：中心偏移 -->
  <line x1="400" y1="140" x2="450" y2="140" stroke="#000000" stroke-width="1.5" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text x="395" y="130" font-family="sans-serif" font-size="14" fill="#000000">中心偏移 (μ - T)</text>
  
  <!-- Cpk 示意：與最近規格界限的距離 -->
  <line x1="450" y1="190" x2="600" y2="190" stroke="#008800" stroke-width="1.5" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text x="460" y="180" font-family="sans-serif" font-size="14" fill="#008800">單側裕度 (USL - μ)</text>
  
  <!-- 公式標註 -->
  <rect x="100" y="20" width="220" height="80" fill="#f9f9f9" stroke="#cccccc"/>
  <text x="110" y="45" font-family="sans-serif" font-size="14" fill="#000000">Cp = (USL - LSL) / 6σ</text>
  <text x="110" y="70" font-family="sans-serif" font-size="14" fill="#000000">Cpk = Cp (1 - |Ca|)</text>
  <text x="110" y="90" font-family="sans-serif" font-size="12" fill="#666666">反映偏移後的實際能力</text>
</svg>