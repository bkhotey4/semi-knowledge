<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0000ff"/>
    </marker>
  </defs>
  <rect x="50" y="50" width="700" height="350" fill="#f8f9fa" stroke="#000000" stroke-width="1"/>
  <text x="400" y="80" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">內連線 RC 延遲模型示意圖</text>
  <rect x="150" y="120" width="500" height="60" fill="#cd7f32" stroke="#000000" stroke-width="1.5"/>
  <rect x="150" y="270" width="500" height="60" fill="#cd7f32" stroke="#000000" stroke-width="1.5"/>
  <line x1="150" y1="100" x2="640" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="95" font-family="sans-serif" font-size="14" text-anchor="middle">訊號傳遞方向</text>
  <line x1="120" y1="120" x2="120" y2="180" stroke="#000000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="110" y="155" font-family="sans-serif" font-size="14" text-anchor="end">線寬 (w)</text>
  <line x1="120" y1="180" x2="120" y2="270" stroke="#000000" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="110" y="230" font-family="sans-serif" font-size="14" text-anchor="end">間距 (s)</text>
  <text x="400" y="155" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">金屬導線 (電阻 R)</text>
  <text x="400" y="305" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">相鄰導線</text>
  <text x="660" y="230" font-family="sans-serif" font-size="14" fill="#000000">層間介電質 (ILD)</text>
  <line x1="380" y1="200" x2="420" y2="200" stroke="#0000ff" stroke-width="3"/>
  <line x1="380" y1="210" x2="420" y2="210" stroke="#0000ff" stroke-width="3"/>
  <line x1="400" y1="180" x2="400" y2="200" stroke="#0000ff" stroke-width="1.5"/>
  <line x1="400" y1="210" x2="400" y2="270" stroke="#0000ff" stroke-width="1.5"/>
  <text x="430" y="210" font-family="sans-serif" font-size="16" fill="#0000ff" font-weight="bold">電容 C</text>
  <rect x="180" y="360" width="440" height="60" fill="#ffffff" stroke="#000000" stroke-dasharray="5,5"/>
  <text x="200" y="395" font-family="sans-serif" font-size="16" fill="#000000">電阻 R ∝ 1 / w</text>
  <text x="420" y="395" font-family="sans-serif" font-size="16" fill="#0000ff">電容 C ∝ 1 / s</text>
  <path d="M 200 150 Q 250 140 300 150" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="250" y="140" font-family="sans-serif" font-size="12" text-anchor="middle">R</text>
</svg>