<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3e50"/>
    </marker>
  </defs>

  <!-- 第一排製程方塊 -->
  <rect x="40" y="60" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="115" y="95" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">基板前處理 (HMDS)</text>

  <rect x="230" y="60" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="305" y="95" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">光阻旋塗</text>

  <rect x="420" y="60" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="495" y="95" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">軟烤 (PAB)</text>

  <rect x="610" y="60" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="685" y="95" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">對準與曝光</text>

  <!-- 第二排製程方塊 -->
  <rect x="610" y="240" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="685" y="275" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">曝後烤 (PEB)</text>

  <rect x="420" y="240" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="495" y="275" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">顯影 (Development)</text>

  <rect x="230" y="240" width="150" height="60" rx="5" fill="#f0f4f8" stroke="#2d3e50" stroke-width="2"/>
  <text x="305" y="275" font-family="sans-serif" font-size="16" fill="#2d3e50" text-anchor="middle">硬烤 (Hard Bake)</text>

  <!-- 連接箭頭 -->
  <line x1="190" y1="90" x2="220" y2="90" stroke="#2d3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="90" x2="410" y2="90" stroke="#2d3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="90" x2="600" y2="90" stroke="#2d3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <path d="M 685 120 L 685 230" fill="none" stroke="#2d3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="610" y1="270" x2="580" y2="270" stroke="#2d3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="270" x2="390" y2="270" stroke="#2d3e50" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 物理狀態標註 -->
  <line x1="115" y1="120" x2="115" y2="145" stroke="#d9534f" stroke-width="1" stroke-dasharray="4"/>
  <text x="115" y="165" font-family="sans-serif" font-size="14" fill="#d9534f" text-anchor="middle">表面疏水化改質</text>

  <line x1="305" y1="120" x2="305" y2="145" stroke="#d9534f" stroke-width="1" stroke-dasharray="4"/>
  <text x="305" y="165" font-family="sans-serif" font-size="14" fill="#d9534f" text-anchor="middle">溶劑初步揮發</text>

  <line x1="495" y1="120" x2="495" y2="145" stroke="#d9534f" stroke-width="1" stroke-dasharray="4"/>
  <text x="495" y="165" font-family="sans-serif" font-size="14" fill="#d9534f" text-anchor="middle">溶劑移除、應力釋放</text>

  <line x1="685" y1="300" x2="685" y2="325" stroke="#d9534f" stroke-width="1" stroke-dasharray="4"/>
  <text x="685" y="345" font-family="sans-serif" font-size="14" fill="#d9534f" text-anchor="middle">酸擴散、消除駐波</text>

  <line x1="305" y1="300" x2="305" y2="325" stroke="#d9534f" stroke-width="1" stroke-dasharray="4"/>
  <text x="305" y="345" font-family="sans-serif" font-size="14" fill="#d9534f" text-anchor="middle">熱交聯、強化抗蝕性</text>

  <!-- 標題 -->
  <text x="400" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2d3e50" text-anchor="middle">圖：微影標準工序流程與物理效應示意圖</text>
</svg>