 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">普凡正常凝固方程式</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 7 章　電子級矽與單晶成長</text><text x="480" y="180" font-size="34" fill="#37474f" font-weight="bold" text-anchor="middle">Cs(g) = keff · C0 · (1 − g)^(keff − 1)</text><text x="70" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Cs(g)</text><text x="180" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">固化分率 g 處的固相雜質濃度</text><text x="510" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">keff</text><text x="620" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">有效偏析係數</text><text x="70" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">C0</text><text x="180" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">初始熔湯平均雜質濃度</text><text x="510" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">g</text><text x="620" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">固化質量佔初始總質量之分率</text><text x="480" y="430" font-size="17" fill="#5f6b7a" font-weight="normal" text-anchor="middle">單批次長晶無補充熔料條件；keff &lt; 1 時雜質隨固化過程向尾端富集。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">偏析效應導致晶棒沿軸向電阻率漂移，尾端雜質富集是降低可利用率的主因。</text></svg>