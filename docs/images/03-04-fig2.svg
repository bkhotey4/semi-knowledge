<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF0000" />
    </marker>
  </defs>

  <!-- 超低膨脹基板 -->
  <rect x="50" y="320" width="700" height="80" fill="#E0E0E0" stroke="#333333" stroke-width="1"/>
  <text x="320" y="370" font-family="sans-serif" font-size="18" fill="#333333">超低膨脹基板 (ULE Substrate)</text>

  <!-- Mo/Si 多層膜結構 (簡化示意) -->
  <rect x="50" y="200" width="700" height="120" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
  
  <!-- 繪製數層交替感 -->
  <rect x="50" y="200" width="700" height="6" fill="#888888"/>
  <rect x="50" y="206" width="700" height="10" fill="#E0E0E0"/>
  <rect x="50" y="216" width="700" height="6" fill="#888888"/>
  <rect x="50" y="222" width="700" height="10" fill="#E0E0E0"/>
  <rect x="50" y="232" width="700" height="6" fill="#888888"/>
  <rect x="50" y="238" width="700" height="10" fill="#E0E0E0"/>
  <rect x="50" y="248" width="700" height="6" fill="#888888"/>
  <rect x="50" y="254" width="700" height="10" fill="#E0E0E0"/>
  
  <!-- 中間省略符號 -->
  <text x="380" y="290" font-family="sans-serif" font-size="24" fill="#333333">...</text>
  
  <rect x="50" y="304" width="700" height="6" fill="#888888"/>
  <rect x="50" y="310" width="700" height="10" fill="#E0E0E0"/>

  <!-- 保護層 -->
  <rect x="50" y="195" width="700" height="5" fill="#333333"/>
  <text x="580" y="190" font-family="sans-serif" font-size="14" fill="#333333">保護層 (Capping Layer)</text>

  <!-- 鉭吸收層圖案 -->
  <rect x="100" y="145" width="200" height="50" fill="#333333"/>
  <rect x="550" y="145" width="150" height="50" fill="#333333"/>
  <text x="110" y="135" font-family="sans-serif" font-size="16" fill="#333333">鉭 (Ta) 吸收層圖案</text>

  <!-- 入射光與反射/吸收路徑 -->
  <!-- 路徑 A: 被吸收 -->
  <line x1="150" y1="50" x2="200" y2="145" stroke="#FF0000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="100" y="40" font-family="sans-serif" font-size="16" fill="#FF0000">入射 EUV 光 (13.5 nm)</text>
  <text x="180" y="110" font-family="sans-serif" font-size="14" fill="#333333" transform="rotate(62 180 110)">光線被吸收</text>

  <!-- 路徑 B: 反射 -->
  <line x1="400" y1="50" x2="450" y2="195" stroke="#FF0000" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 450 195 Q 460 210 470 195" fill="none" stroke="#FF0000" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="450" y1="195" x2="520" y2="50" stroke="#FF0000" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="530" y="45" font-family="sans-serif" font-size="16" fill="#FF0000">反射光 (布拉格反射)</text>

  <!-- 標籤說明 -->
  <line x1="760" y1="200" x2="760" y2="320" stroke="#333333" stroke-width="1"/>
  <line x1="755" y1="200" x2="765" y2="200" stroke="#333333" stroke-width="1"/>
  <line x1="755" y1="320" x2="765" y2="320" stroke="#333333" stroke-width="1"/>
  <text x="610" y="270" font-family="sans-serif" font-size="16" fill="#333333">Mo/Si 多層膜 (約 40 對)</text>
  
  <!-- 物理細節標註 -->
  <text x="460" y="230" font-family="sans-serif" font-size="14" fill="#333333">週期 d ≈ 7 nm</text>
</svg>