<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- 箭頭定義 -->
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1E293B" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#059669" />
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff" />

  <!-- 圖標題 -->
  <text x="400" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">原子層蝕刻（ALE）兩階段自限循環機制</text>

  <!-- 左側卡片：步驟 A 表面改質 -->
  <rect x="35" y="55" width="345" height="330" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.5" />
  <text x="207" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">步驟 A：化學吸附改質</text>
  <text x="207" y="108" font-family="sans-serif" font-size="14" fill="#059669" text-anchor="middle">反應物（如 Cl₂）前驅氣體注入</text>

  <!-- 左側氣體分子與吸附方向 -->
  <g>
    <!-- Cl2 分子 1 -->
    <circle cx="120" cy="140" r="9" fill="#059669" />
    <circle cx="134" cy="140" r="9" fill="#059669" />
    <line x1="127" y1="155" x2="127" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
    
    <!-- Cl2 分子 2 -->
    <circle cx="200" cy="130" r="9" fill="#059669" />
    <circle cx="214" cy="130" r="9" fill="#059669" />
    <line x1="207" y1="145" x2="207" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />

    <!-- Cl2 分子 3 -->
    <circle cx="280" cy="140" r="9" fill="#059669" />
    <circle cx="294" cy="140" r="9" fill="#059669" />
    <line x1="287" y1="155" x2="287" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />

    <text x="207" y="180" font-family="sans-serif" font-size="14" fill="#059669" text-anchor="middle">自限性化學吸附</text>
  </g>

  <!-- 左側晶圓表面模型 -->
  <!-- 改質層 -->
  <rect x="55" y="215" width="305" height="26" fill="#059669" stroke="#1E293B" stroke-width="1.2" />
  <text x="207" y="233" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">表面改質薄層（如 SiClₓ）</text>

  <!-- 矽基材 -->
  <rect x="55" y="241" width="305" height="95" fill="#475569" stroke="#1E293B" stroke-width="1.2" />
  <text x="207" y="293" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">底層基材（Bulk Si）</text>
  <text x="207" y="365" font-family="sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">自限飽和：反應深度受限於表面單層</text>

  <!-- 推進箭頭 A -> B -->
  <g>
    <path d="M 385 200 L 415 200" stroke="#1E293B" stroke-width="2.5" marker-end="url(#arrow-slate)" />
    <text x="400" y="190" font-family="sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">吹淨</text>
  </g>

  <!-- 右側卡片：步驟 B 選擇性移除 -->
  <rect x="420" y="55" width="345" height="330" rx="8" fill="#F1F5F9" stroke="#1E293B" stroke-width="1.5" />
  <text x="592" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">步驟 B：選擇性脫附移除</text>
  <text x="592" y="108" font-family="sans-serif" font-size="14" fill="#2563EB" text-anchor="middle">低能量離子（Ar⁺）或熱激發</text>

  <!-- 右側入射離子束與揮發產物 -->
  <g>
    <!-- 入射 Ar+ 離子 -->
    <line x1="490" y1="125" x2="490" y2="185" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="490" y="120" font-family="sans-serif" font-size="14" fill="#2563EB" text-anchor="middle">Ar⁺</text>

    <line x1="550" y1="125" x2="550" y2="185" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <text x="550" y="120" font-family="sans-serif" font-size="14" fill="#2563EB" text-anchor="middle">Ar⁺</text>

    <!-- 揮發性脫附產物 -->
    <circle cx="650" cy="148" r="8" fill="#059669" />
    <circle cx="663" cy="148" r="6" fill="#475569" />
    <line x1="656" y1="178" x2="656" y2="135" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-green)" />
    <text x="656" y="120" font-family="sans-serif" font-size="14" fill="#059669" text-anchor="middle">揮發產物 (SiCl₄)</text>
    <text x="570" y="178" font-family="sans-serif" font-size="14" fill="#2563EB" text-anchor="middle">方向性物理/化學脫附</text>
  </g>

  <!-- 右側晶圓表面模型 -->
  <!-- 蝕刻移除後的基材表面 -->
  <rect x="440" y="241" width="305" height="95" fill="#475569" stroke="#1E293B" stroke-width="1.2" />
  <!-- 原改質層殘餘/脫附虛線示意 -->
  <rect x="440" y="215" width="305" height="26" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" />
  <text x="592" y="232" font-family="sans-serif" font-size="14" fill="#059669" text-anchor="middle">改質薄層完全脫附移除</text>
  <text x="592" y="280" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">底層基材（未受物理損傷）</text>
  <text x="592" y="304" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">能量窗口控制：E_th,mod &lt; E_ion &lt; E_th,bulk</text>
  <text x="592" y="365" font-family="sans-serif" font-size="14" fill="#1E293B" text-anchor="middle">自限停止：基材無改質即停止蝕刻</text>

  <!-- 底部循環回饋箭頭與說明 -->
  <g>
    <path d="M 592 390 L 592 422 L 207 422 L 207 392" fill="none" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-slate)" />
    <rect x="290" y="410" width="220" height="24" fill="#ffffff" />
    <text x="400" y="427" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">循環重複：原子級厚度控制（單循環 EPC）</text>
  </g>
</svg>