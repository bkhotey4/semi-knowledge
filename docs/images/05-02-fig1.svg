<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="ion-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#ff0000"/>
    </marker>
  </defs>

  <text x="400" y="40" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#000000">圖 26.3 晶格通道效應示意圖</text>

  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="250" height="280" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
    <text x="125" y="-15" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">非晶質或傾斜佈植</text>
    
    <g fill="#888888">
      <circle cx="40" cy="45" r="6"/><circle cx="95" cy="35" r="6"/><circle cx="155" cy="48" r="6"/><circle cx="210" cy="38" r="6"/>
      <circle cx="35" cy="105" r="6"/><circle cx="105" cy="95" r="6"/><circle cx="145" cy="110" r="6"/><circle cx="205" cy="98" r="6"/>
      <circle cx="50" cy="165" r="6"/><circle cx="90" cy="155" r="6"/><circle cx="160" cy="170" r="6"/><circle cx="215" cy="158" r="6"/>
      <circle cx="45" cy="225" r="6"/><circle cx="100" cy="215" r="6"/><circle cx="150" cy="230" r="6"/><circle cx="200" cy="218" r="6"/>
    </g>

    <path d="M 70,-60 L 70,0 L 85,30 L 60,80 L 75,120" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#ion-arrow)"/>
    <path d="M 170,-60 L 170,0 L 155,45 L 180,95 L 165,135" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#ion-arrow)"/>
    
    <line x1="260" y1="127" x2="300" y2="127" stroke="#0000ff" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="305" y="132" font-family="sans-serif" font-size="14" fill="#0000ff">投影射程 (Rp)</text>
  </g>

  <g transform="translate(450, 120)">
    <rect x="0" y="0" width="250" height="280" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
    <text x="125" y="-15" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">晶軸對準佈植 (通道效應)</text>
    
    <g fill="#888888">
      <circle cx="50" cy="40" r="6"/><circle cx="100" cy="40" r="6"/><circle cx="150" cy="40" r="6"/><circle cx="200" cy="40" r="6"/>
      <circle cx="50" cy="100" r="6"/><circle cx="100" cy="100" r="6"/><circle cx="150" cy="100" r="6"/><circle cx="200" cy="100" r="6"/>
      <circle cx="50" cy="160" r="6"/><circle cx="100" cy="160" r="6"/><circle cx="150" cy="160" r="6"/><circle cx="200" cy="160" r="6"/>
      <circle cx="50" cy="220" r="6"/><circle cx="100" cy="220" r="6"/><circle cx="150" cy="220" r="6"/><circle cx="200" cy="220" r="6"/>
    </g>

    <path d="M 75,-60 L 75,260" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#ion-arrow)"/>
    <path d="M 125,-60 L 125,260" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#ion-arrow)"/>
    <path d="M 175,-60 L 175,260" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#ion-arrow)"/>

    <line x1="-20" y1="260" x2="20" y2="260" stroke="#0000ff" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="30" y="265" font-family="sans-serif" font-size="14" fill="#0000ff">通道深度</text>
  </g>

  <g transform="translate(50, 50)">
    <circle cx="0" cy="0" r="4" fill="#ff0000"/>
    <text x="10" y="5" font-family="sans-serif" font-size="14">入射離子</text>
    <circle cx="0" cy="30" r="6" fill="#888888"/>
    <text x="10" y="35" font-family="sans-serif" font-size="14">格點原子</text>
  </g>

  <line x1="360" y1="247" x2="430" y2="380" stroke="#0000ff" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="330" y="320" font-family="sans-serif" font-size="14" fill="#0000ff" text-anchor="middle">深度差異</text>

  <line x1="100" y1="120" x2="700" y2="120" stroke="#000000" stroke-width="2"/>
  <text x="710" y="125" font-family="sans-serif" font-size="14">晶圓表面</text>
</svg>