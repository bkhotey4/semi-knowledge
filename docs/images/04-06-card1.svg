 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">原子級精確度的自限性製程</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 23 章　原子層沉積 (ALD) 與原子層蝕刻 (ALE)</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">ALD 與 ALE 核心在於化學吸附飽和引發的自限性機制。</text><circle cx="64" cy="217.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="225.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="225.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">ALD 透過循環次數精確控制膜厚，具備近乎 100% 的保形性。</text><circle cx="64" cy="292.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="300.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="300.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">ALE 結合表面修飾與選擇性移除，實現原子級蝕刻精度。</text><circle cx="64" cy="367.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="375.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="375.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">兩者為 GAAFET 與 High-k 閘極結構量產的關鍵技術。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">自限性反應是實現奈米尺度下原子級控制的核心物理機制。</text></svg>