<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 全圖標題 -->
  <text x="400" y="32" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">熱平衡下半導體之載子統計分佈</text>

  <!-- 能階參考虛線（貫穿三欄） -->
  <line x1="75" y1="145" x2="745" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="75" y1="195" x2="745" y2="195" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="75" y1="285" x2="745" y2="285" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 能階文字標記 -->
  <text x="70" y="150" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#1e293b">導帶底 Ec</text>
  <text x="70" y="200" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#1e293b">費米能階 Ef</text>
  <text x="70" y="290" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#1e293b">價帶頂 Ev</text>

  <!-- ==================== 第一欄：態密度 g(E) ==================== -->
  <text x="180" y="65" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">(a) 態密度 g(E)</text>
  
  <!-- 坐標軸 -->
  <line x1="120" y1="390" x2="120" y2="75" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="390" x2="255" y2="390" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="115" y="75" font-family="sans-serif" font-size="14" text-anchor="end" fill="#1e293b">E</text>
  <text x="255" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">g(E)</text>

  <!-- 導帶態密度 gc(E) 拋物線 -->
  <path d="M 120 145 Q 165 140 230 85" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="225" y="115" font-family="sans-serif" font-size="14" fill="#2563eb">gc(E) ∝ √(E-Ec)</text>

  <!-- 價帶態密度 gv(E) 拋物線 -->
  <path d="M 120 285 Q 165 290 230 345" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="225" y="325" font-family="sans-serif" font-size="14" fill="#dc2626">gv(E) ∝ √(Ev-E)</text>

  <!-- 禁帶說明 -->
  <text x="155" y="220" font-family="sans-serif" font-size="14" fill="#94a3b8">帶隙禁帶 g(E)=0</text>

  <!-- ==================== 第二欄：費米-狄拉克分佈 f(E) ==================== -->
  <text x="405" y="65" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">(b) 費米-狄拉克分佈 f(E)</text>

  <!-- 坐標軸 -->
  <line x1="345" y1="390" x2="345" y2="75" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="390" x2="480" y2="390" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="75" font-family="sans-serif" font-size="14" text-anchor="end" fill="#1e293b">E</text>
  <text x="480" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">f(E)</text>

  <!-- f(E) 刻度線與數值 -->
  <line x1="450" y1="390" x2="450" y2="85" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="345" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">0</text>
  <text x="398" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">0.5</text>
  <text x="450" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">1.0</text>

  <!-- 費米函數曲線 S 型 -->
  <path d="M 450 365 C 448 275, 425 210, 397.5 195 C 370 180, 347 135, 345 85" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="397.5" cy="195" r="3.5" fill="#1e293b"/>
  <text x="408" y="190" font-family="sans-serif" font-size="14" fill="#1e293b">f(Ef) = 1/2</text>

  <!-- ==================== 第三欄：載子濃度分佈 ==================== -->
  <text x="645" y="65" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">(c) 載子濃度分佈</text>

  <!-- 坐標軸 -->
  <line x1="575" y1="390" x2="575" y2="75" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="390" x2="720" y2="390" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="75" font-family="sans-serif" font-size="14" text-anchor="end" fill="#1e293b">E</text>
  <text x="720" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">濃度</text>

  <!-- 導帶電子濃度面積 n(E) = gc(E)*f(E) -->
  <path d="M 575 145 C 625 144, 655 130, 645 115 C 635 100, 595 88, 575 85 Z" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="115" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2563eb">電子濃度 n</text>
  <text x="655" y="135" font-family="sans-serif" font-size="14" fill="#2563eb">n(E) = gc·f</text>

  <!-- 價帶電洞濃度面積 p(E) = gv(E)*[1-f(E)] -->
  <path d="M 575 285 C 610 286, 630 298, 620 312 C 610 326, 588 340, 575 345 Z" fill="#dc2626" fill-opacity="0.35" stroke="#dc2626" stroke-width="2"/>
  <text x="635" y="305" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">電洞濃度 p</text>
  <text x="635" y="325" font-family="sans-serif" font-size="14" fill="#dc2626">p(E) = gv·(1-f)</text>
</svg>