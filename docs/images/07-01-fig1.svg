<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="bluearrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90E2"/>
    </marker>
  </defs>

  <rect x="200" y="360" width="400" height="40" fill="#9B9B9B"/>
  <text x="400" y="420" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#000000">基板 (Substrate)</text>
  
  <rect x="200" y="345" width="400" height="15" fill="#F5A623"/>
  <text x="610" y="357" font-family="sans-serif" font-size="16" fill="#000000">薄膜 (厚度 d, 折射率 n)</text>

  <line x1="400" y1="345" x2="400" y2="200" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
  <path d="M 400 280 A 70 70 0 0 0 350 295" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="360" y="270" font-family="sans-serif" font-size="16" text-anchor="middle">入射角 θi</text>

  <line x1="100" y1="100" x2="400" y2="345" stroke="#4A90E2" stroke-width="3" marker-end="url(#bluearrow)"/>
  <line x1="400" y1="345" x2="700" y2="100" stroke="#4A90E2" stroke-width="3" marker-end="url(#bluearrow)"/>

  <rect x="50" y="70" width="80" height="40" fill="#E0E0E0" stroke="#000000"/>
  <text x="90" y="60" font-family="sans-serif" font-size="14" text-anchor="middle">光源與起偏器</text>
  
  <rect x="180" y="150" width="40" height="30" fill="#E0E0E0" stroke="#000000" transform="rotate(-39, 180, 150)"/>
  <text x="140" y="180" font-family="sans-serif" font-size="14">補償器</text>

  <rect x="580" y="160" width="40" height="30" fill="#E0E0E0" stroke="#000000" transform="rotate(39, 580, 160)"/>
  <text x="630" y="185" font-family="sans-serif" font-size="14">檢偏器</text>
  
  <rect x="670" y="70" width="80" height="40" fill="#E0E0E0" stroke="#000000"/>
  <text x="710" y="60" font-family="sans-serif" font-size="14" text-anchor="middle">偵測器</text>

  <g transform="translate(200, 200) rotate(-39)">
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#000000" stroke-width="1"/>
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#FF0000" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>
    <text x="25" y="5" font-family="sans-serif" font-size="12">線偏振</text>
  </g>

  <g transform="translate(550, 200) rotate(39)">
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#000000" stroke-width="1"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#000000" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#FF0000" stroke-width="2"/>
    <text x="30" y="5" font-family="sans-serif" font-size="12">橢圓偏振</text>
  </g>

  <g transform="translate(450, 280)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="35" y="5" font-family="sans-serif" font-size="14">Es (垂直分量)</text>
    <line x1="0" y1="0" x2="18" y2="-24" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="20" y="-30" font-family="sans-serif" font-size="14">Ep (平行分量)</text>
  </g>

  <text x="400" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">光譜橢圓偏光術 (SE) 量測原理示意圖</text>
</svg>