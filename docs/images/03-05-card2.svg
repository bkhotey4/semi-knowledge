 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">瑞利景深公式</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 15 章　High-NA EUV</text><text x="480" y="180" font-size="46" fill="#37474f" font-weight="bold" text-anchor="middle">DOF = k₂ · λ / NA²</text><text x="70" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">DOF</text><text x="180" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">成像系統光學景深</text><text x="510" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">k₂</text><text x="620" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">製程因子，先進製程典型值0.4至0.6</text><text x="70" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">λ</text><text x="180" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">極紫外光源真空波長（13.5 nm）</text><text x="510" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">NA</text><text x="620" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">光學系統數值孔徑，High-NA為0.55</text><text x="480" y="430" font-size="17" fill="#5f6b7a" font-weight="normal" text-anchor="middle">景深與NA平方成反比，NA由0.33升至0.55使景深急遽壓縮至約36%。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">數值孔徑提升使景深急遽衰減，迫使光阻薄化至20奈米以下以防散焦。</text></svg>