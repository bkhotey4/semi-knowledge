 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">微影製程流程與光阻化學核心</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 11 章　微影製程流程與光阻化學</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">標準工序包含塗佈、烘烤、曝光、顯影，各步涉及精密物理化學變化。</text><circle cx="64" cy="217.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="225.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="225.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">化學增幅型光阻利用光酸催化反應提升靈敏度，但受限於 RLS 三角權衡</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">。</text><circle cx="64" cy="328.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="336.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="336.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">金屬氧化物光阻透過高原子序元素提升 EUV 吸收率，突破傳統解析度極</text><text x="100" y="372.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">限。</text><circle cx="64" cy="439.5" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="447.5" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="447.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">曝後烤與顯影動態決定最終圖案的關鍵尺寸均勻度與側壁垂直度。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">掌握光阻化學反應與熱預算控制是實現奈米級圖案轉移的關鍵。</text></svg>