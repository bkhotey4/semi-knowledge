<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><defs><marker id="ar-00796b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker><marker id="ar-1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ar-2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar-37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar-3f51b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="ar-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="ar-6a1b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="ar-90a4ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker><marker id="ar-c62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ar-e65100" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker></defs><rect x="1" y="1" width="958" height="598" rx="24" fill="#ffffff" stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">HBM 物理架構與技術演進</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 40 章　高頻寬記憶體 (HBM)</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">透過矽穿孔 (TSV) 垂直堆疊 DRAM 晶粒，解決記憶體牆 (Memory Wall</text><text x="100" y="186.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">) 瓶頸。</text><circle cx="64" cy="253.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="261.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">採「以寬度換取頻率」策略，藉由 1024/2048-bit 寬位元介面提升總頻</text><text x="100" y="297.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">寬。</text><circle cx="64" cy="364.5" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="372.5" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="372.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">基礎晶粒 (Base Die) 負責控制邏輯，製程趨向與先進邏輯節點 (如 5n</text><text x="100" y="408.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">m) 整合。</text><circle cx="64" cy="475.75" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="483.75" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="483.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">散熱管理、晶圓薄化應力與已知合格晶粒 (KGD) 良率為量產三大挑戰。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">HBM 藉由 3D 封裝與寬介面，在低功耗下實現極致頻寬，支撐高效能運算。</text></svg>