<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="dim-arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#1e293b"/>
    </marker>
    <marker id="dim-arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- 圖例 (Legend) -->
  <g transform="translate(640, 28)">
    <rect x="0" y="0" width="135" height="84" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="12" y="14" width="16" height="12" fill="#3b82f6" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="25" font-family="sans-serif" font-size="14" fill="#1e293b">芯模 (Mandrel)</text>
    <rect x="12" y="37" width="16" height="12" fill="#f59e0b" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="48" font-family="sans-serif" font-size="14" fill="#1e293b">間隔層 (Spacer)</text>
    <rect x="12" y="60" width="16" height="12" fill="#cbd5e1" stroke="#1e293b" stroke-width="1"/>
    <text x="36" y="71" font-family="sans-serif" font-size="14" fill="#1e293b">底層基板</text>
  </g>

  <!-- 步驟 (a) 芯模圖案化 -->
  <g transform="translate(0, 0)">
    <text x="35" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">(a) 芯模圖案化 (Mandrel Patterning)</text>
    <text x="58" y="80" font-family="sans-serif" font-size="14" fill="#1e293b">微影定義初始芯模，週期為 P</text>
    
    <!-- 截面圖 -->
    <rect x="370" y="76" width="240" height="14" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="420" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="500" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="580" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- 間距 P 標註線 -->
    <line x1="430" y1="28" x2="510" y2="28" stroke="#1e293b" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <line x1="430" y1="24" x2="430" y2="38" stroke="#1e293b" stroke-width="1"/>
    <line x1="510" y1="24" x2="510" y2="38" stroke="#1e293b" stroke-width="1"/>
    <text x="464" y="24" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">P</text>
  </g>

  <!-- 步驟流程箭頭 1 -->
  <line x1="490" y1="96" x2="490" y2="114" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 步驟 (b) 共形間隔層沉積 -->
  <g transform="translate(0, 96)">
    <text x="35" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">(b) 共形間隔層沉積 (Conformal Deposition)</text>
    <text x="58" y="80" font-family="sans-serif" font-size="14" fill="#1e293b">以 ALD 均勻沉積厚度 T 之薄膜</text>
    
    <!-- 截面圖 -->
    <rect x="370" y="76" width="240" height="14" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 370 76 L 370 60 L 400 60 L 400 24 L 460 24 L 460 60 L 480 60 L 480 24 L 540 24 L 540 60 L 560 60 L 560 24 L 610 24 L 610 76 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="420" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="500" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="580" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>

    <!-- 厚度 T 標註 -->
    <line x1="400" y1="16" x2="420" y2="16" stroke="#1e293b" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <text x="410" y="12" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">T</text>
  </g>

  <!-- 步驟流程箭頭 2 -->
  <line x1="490" y1="192" x2="490" y2="210" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 步驟 (c) 間隔層非等向回蝕 -->
  <g transform="translate(0, 192)">
    <text x="35" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">(c) 間隔層回蝕 (Spacer Etch-back)</text>
    <text x="58" y="80" font-family="sans-serif" font-size="14" fill="#1e293b">非等向乾式蝕刻去除頂部與底部薄膜</text>
    
    <!-- 垂直蝕刻離子流示意箭頭 -->
    <line x1="390" y1="20" x2="390" y2="34" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="470" y1="20" x2="470" y2="34" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="550" y1="20" x2="550" y2="34" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- 截面圖 -->
    <rect x="370" y="76" width="240" height="14" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="400" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="420" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="440" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    
    <rect x="480" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="500" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="520" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>

    <rect x="560" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="580" y="40" width="20" height="36" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="600" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- 步驟流程箭頭 3 -->
  <line x1="490" y1="288" x2="490" y2="306" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 步驟 (d) 選擇性去除芯模 -->
  <g transform="translate(0, 288)">
    <text x="35" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">(d) 芯模去除 (Mandrel Removal)</text>
    <text x="58" y="80" font-family="sans-serif" font-size="14" fill="#1e293b">高選擇比剝除芯模，圖案密度倍增</text>
    
    <!-- 截面圖 -->
    <rect x="370" y="76" width="240" height="14" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="400" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="440" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="480" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="520" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="560" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="600" y="40" width="20" height="36" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>

    <!-- 間距 P/2 標註線 -->
    <line x1="400" y1="104" x2="440" y2="104" stroke="#1e293b" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <line x1="400" y1="92" x2="400" y2="108" stroke="#1e293b" stroke-width="1"/>
    <line x1="440" y1="92" x2="440" y2="108" stroke="#1e293b" stroke-width="1"/>
    <text x="420" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">P / 2</text>

    <!-- 線寬 CD 標註線 -->
    <line x1="480" y1="104" x2="500" y2="104" stroke="#1e293b" stroke-width="1.2" marker-start="url(#dim-arrow-start)" marker-end="url(#dim-arrow-end)"/>
    <line x1="480" y1="92" x2="480" y2="108" stroke="#1e293b" stroke-width="1"/>
    <line x1="500" y1="92" x2="500" y2="108" stroke="#1e293b" stroke-width="1"/>
    <text x="490" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#1e293b">CD = T</text>
  </g>
</svg>