<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444444"/>
    </marker>
    <marker id="fieldarrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M1,1 L5,3 L1,5 Z" fill="#e53935"/>
    </marker>
  </defs>

  <rect x="50" y="330" width="700" height="80" fill="#e8e8e8"/>
  <rect x="50" y="150" width="150" height="180" fill="#e8e8e8"/>
  <rect x="600" y="150" width="150" height="180" fill="#e8e8e8"/>
  
  <rect x="200" y="150" width="100" height="180" fill="#cd7f32"/>
  <rect x="500" y="150" width="100" height="180" fill="#cd7f32"/>
  
  <path d="M 300 150 Q 400 170 500 150 L 500 330 L 300 330 Z" fill="#e8e8e8"/>
  <path d="M 400 190 Q 330 200 330 260 Q 330 320 400 320 Q 470 320 470 260 Q 470 200 400 190 Z" fill="#ffffff" stroke="#444444" stroke-width="1" stroke-dasharray="4"/>
  
  <path d="M 50 120 L 750 120 L 750 150 L 600 150 L 500 150 Q 400 175 300 150 L 200 150 L 50 150 Z" fill="#444444"/>

  <line x1="300" y1="260" x2="500" y2="260" stroke="#e53935" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#fieldarrow)" marker-start="url(#fieldarrow)"/>

  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">空氣間隙 (Air Gap) 結構示意圖</text>
  
  <text x="400" y="100" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#444444">封止層 (Capping Layer / Sealing Layer)</text>
  <line x1="400" y1="105" x2="400" y2="125" stroke="#444444" stroke-width="1" marker-end="url(#arrowhead)"/>

  <text x="250" y="245" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">銅導線</text>
  <text x="250" y="265" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">(Cu)</text>
  
  <text x="550" y="245" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">銅導線</text>
  <text x="550" y="265" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">(Cu)</text>

  <text x="400" y="245" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#444444" font-weight="bold">空氣間隙</text>
  <text x="400" y="265" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#444444">k ≈ 1.0</text>
  
  <text x="125" y="375" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#444444">低介電材料 (Low-k Matrix)</text>
  
  <text x="400" y="370" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#e53935">寄生電容降低 (Reduced C_para)</text>
  
  <line x1="100" y1="330" x2="100" y2="280" stroke="#444444" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="100" y="270" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#444444">層間介電質 (ILD)</text>

  <rect x="340" y="285" width="120" height="25" rx="5" fill="none" stroke="#e53935" stroke-width="1"/>
  <text x="400" y="302" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e53935">電力線穿過真空層</text>
</svg>