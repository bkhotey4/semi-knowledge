 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">封裝演進與互連技術</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 37 章　封裝演進：從打線到覆晶</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">封裝具備電力分配、訊號分佈、散熱管理與物理保護四大核心功能。</text><circle cx="64" cy="217.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="225.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="225.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">打線接合透過熱壓與超音波能量實現固態焊接，但寄生電感限制高頻效能</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">。</text><circle cx="64" cy="328.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="336.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="336.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">覆晶技術利用面陣列凸塊縮短路徑，降低寄生效應並提升 I/O 密度。</text><circle cx="64" cy="403.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="411.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="411.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">扇出型封裝透過重佈線層取消基板，實現極致輕薄與異質整合。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">封裝從保護外殼演進為決定系統效能與散熱極限的關鍵互連平台。</text></svg>