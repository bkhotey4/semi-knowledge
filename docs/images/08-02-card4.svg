<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><defs><marker id="ar-00796b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker><marker id="ar-1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ar-2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar-37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar-3f51b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="ar-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="ar-6a1b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="ar-90a4ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker><marker id="ar-c62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ar-e65100" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker></defs><rect x="1" y="1" width="958" height="598" rx="24" fill="#ffffff" stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">2.5D 封裝最終良率模型</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 38 章　2.5D 封裝與 CoWoS</text><text x="480" y="180" font-size="24" fill="#37474f" font-weight="bold" text-anchor="middle">Y_final = Y_interposer * Y_logic * (Y_HBM)ⁿ * Y_assembly</text><text x="70" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Y_final</text><text x="180" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">最終封裝總良率</text><text x="510" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Y_logic</text><text x="620" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">邏輯晶粒 KGD 良率</text><text x="70" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Y_HBM</text><text x="180" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">單顆 HBM 良率</text><text x="510" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">n</text><text x="620" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">HBM 堆疊數量</text><text x="70" y="354" font-size="17" fill="#1f2430" font-weight="bold" text-anchor="start">Y_assembly</text><text x="180" y="354.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">組裝製程良率</text><text x="480" y="430" font-size="17" fill="#5f6b7a" font-weight="normal" text-anchor="middle">典型值 n=8 時，即使單一組件良率高，最終良率仍受多晶片累積影響。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">多晶片封裝之最終良率隨組件數量呈指數型下降，KGD 篩選為量產成功之關鍵。</text></svg>