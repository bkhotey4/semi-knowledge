<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#212529"/>
    </marker>
    <marker id="arrow-red-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-red-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 圖名 -->
  <text x="400" y="38" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#212529">三類材料能帶結構比較</text>

  <!-- ==================== 第一組：導體 ==================== -->
  <!-- 能量軸 -->
  <line x1="85" y1="355" x2="85" y2="95" stroke="#212529" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="80" y="85" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#212529">能量 E</text>

  <!-- 導體能帶本體（重疊） -->
  <!-- 導帶部分（藍色） -->
  <rect x="115" y="140" width="115" height="115" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
  <!-- 價帶部分（橘色） -->
  <rect x="115" y="195" width="115" height="145" fill="#d97706" fill-opacity="0.35" stroke="#d97706" stroke-width="2"/>
  <!-- 重疊區域（加深表示電子填滿至費米能階） -->
  <rect x="115" y="225" width="115" height="115" fill="#212529" fill-opacity="0.12"/>

  <!-- 能階界線與標示 -->
  <!-- 價帶頂 Ev -->
  <line x1="105" y1="195" x2="230" y2="195" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="199" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d97706">Ev</text>

  <!-- 導帶底 Ec -->
  <line x1="105" y1="255" x2="230" y2="255" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="260" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#2563eb">Ec</text>

  <!-- 費米能階 Ef -->
  <line x1="110" y1="225" x2="235" y2="225" stroke="#dc2626" stroke-width="2"/>
  <text x="242" y="230" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">EF</text>

  <!-- 能帶名稱標記 -->
  <text x="172" y="170" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2563eb">導帶 (CB)</text>
  <text x="172" y="320" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#d97706">價帶 (VB)</text>
  <text x="172" y="213" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">能帶重疊</text>

  <!-- 導體底部說明 -->
  <text x="172" y="385" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">導體</text>
  <text x="172" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529">能隙 Eg = 0</text>


  <!-- ==================== 第二組：半導體 ==================== -->
  <!-- 能量軸 -->
  <line x1="335" y1="355" x2="335" y2="95" stroke="#212529" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="330" y="85" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#212529">能量 E</text>

  <!-- 導帶（全空或微量激發） -->
  <rect x="365" y="125" width="115" height="70" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/>
  <!-- 價帶（近乎全滿） -->
  <rect x="365" y="260" width="115" height="80" fill="#d97706" fill-opacity="0.75" stroke="#d97706" stroke-width="2"/>

  <!-- 能階界線與標示 -->
  <!-- 導帶底 Ec -->
  <line x1="355" y1="195" x2="480" y2="195" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="200" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#2563eb">Ec</text>

  <!-- 價帶頂 Ev -->
  <line x1="355" y1="260" x2="480" y2="260" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="265" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#d97706">Ev</text>

  <!-- 本質費米能階 Ef -->
  <line x1="365" y1="227" x2="480" y2="227" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="487" y="232" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">EF</text>

  <!-- 能隙 Eg 標示箭頭 -->
  <line x1="422" y1="202" x2="422" y2="253" stroke="#dc2626" stroke-width="1.5" marker-start="url(#arrow-red-down)" marker-end="url(#arrow-red-up)"/>
  <rect x="382" y="217" width="80" height="20" fill="#ffffff" fill-opacity="0.9"/>
  <text x="422" y="232" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Eg ≈ 1 eV</text>

  <!-- 能帶名稱標記 -->
  <text x="422" y="165" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2563eb">導帶 (空態)</text>
  <text x="422" y="305" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">價帶 (滿態)</text>

  <!-- 半導體底部說明 -->
  <text x="422" y="385" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">半導體</text>
  <text x="422" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529">能隙約 0.5～3.5 eV</text>


  <!-- ==================== 第三組：絕緣體 ==================== -->
  <!-- 能量軸 -->
  <line x1="585" y1="355" x2="585" y2="95" stroke="#212529" stroke-width="2" marker-end="url(#arrow-axis)"/>
  <text x="580" y="85" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#212529">能量 E</text>

  <!-- 導帶（完全空態） -->
  <rect x="615" y="105" width="115" height="45" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
  <!-- 價帶（完全填滿） -->
  <rect x="615" y="295" width="115" height="45" fill="#d97706" fill-opacity="0.85" stroke="#d97706" stroke-width="2"/>

  <!-- 能階界線與標示 -->
  <!-- 導帶底 Ec -->
  <line x1="605" y1="150" x2="730" y2="150" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="155" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#2563eb">Ec</text>

  <!-- 價帶頂 Ev -->
  <line x1="605" y1="295" x2="730" y2="295" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="300" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#d97706">Ev</text>

  <!-- 費米能階 Ef -->
  <line x1="615" y1="222" x2="730" y2="222" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="737" y="227" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">EF</text>

  <!-- 寬能隙 Eg 標示箭頭 -->
  <line x1="672" y1="157" x2="672" y2="288" stroke="#dc2626" stroke-width="1.5" marker-start="url(#arrow-red-down)" marker-end="url(#arrow-red-up)"/>
  <rect x="627" y="212" width="90" height="20" fill="#ffffff" fill-opacity="0.9"/>
  <text x="672" y="227" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Eg &gt; 5 eV</text>

  <!-- 能帶名稱標記 -->
  <text x="672" y="133" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#2563eb">導帶 (全空)</text>
  <text x="672" y="323" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">價帶 (全滿)</text>

  <!-- 絕緣體底部說明 -->
  <text x="672" y="385" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">絕緣體</text>
  <text x="672" y="410" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#212529">寬禁帶 (高阻抗)</text>
</svg>