 stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">酸擴散特徵長度</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 11 章　微影製程流程與光阻化學</text><text x="480" y="180" font-size="46" fill="#37474f" font-weight="bold" text-anchor="middle">Ldiff = 2 * √(Dacid * tPEB)</text><text x="70" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Ldiff</text><text x="180" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">酸擴散特徵長度</text><text x="510" y="250" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">Dacid</text><text x="620" y="250.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">酸擴散係數</text><text x="70" y="302" font-size="22" fill="#1f2430" font-weight="bold" text-anchor="start">tPEB</text><text x="180" y="302.0" font-size="18" fill="#5f6b7a" font-weight="normal" text-anchor="start">曝後烤烘烤時間</text><text x="480" y="430" font-size="17" fill="#5f6b7a" font-weight="normal" text-anchor="middle">擴散長度需略大於駐波半週期以平滑側壁，但過大會造成圖案模糊。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">精確控制 PEB 溫度與時間是平衡駐波效應與解析度的核心。</text></svg>