<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><defs><marker id="ar-00796b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker><marker id="ar-1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ar-2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar-37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar-3f51b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="ar-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="ar-6a1b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker><marker id="ar-90a4ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker><marker id="ar-c62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ar-e65100" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker></defs><rect x="1" y="1" width="958" height="598" rx="24" fill="#ffffff" stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">良率模型與良率提升核心觀念</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 35 章　良率模型與良率提升</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">總良率為流水線、晶粒、封裝及測試良率之乘積，晶粒良率反映技術成熟</text><text x="100" y="186.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">度。</text><circle cx="64" cy="253.25" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="261.25" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="261.25" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">缺陷分隨機與系統性；前者源於環境微粒，後者源於製程邊際性或設計限</text><text x="100" y="297.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">制。</text><circle cx="64" cy="364.5" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="372.5" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="372.5" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">負二項模型引入群聚參數 α，能比 Poisson 模型更精確描述先進製程失</text><text x="100" y="408.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">效。</text><circle cx="64" cy="475.75" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="483.75" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="483.75" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">透過晶圓圖型態識別與帕累托分析，可精準定位製程根因並加速良率學習</text><text x="100" y="520.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">良率提升是結合數學模型、空間型態分析與物理失效分析的動態學習過程。</text></svg>