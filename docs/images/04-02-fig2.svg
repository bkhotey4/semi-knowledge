<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3498db"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2b3e50"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 左側與多層膜結構 (x=130 到 x=430) -->
  <!-- 硬遮罩 Hard Mask (y=50 到 y=100) -->
  <rect x="130" y="50" width="300" height="50" fill="#2b3e50"/>

  <!-- ONO 交替堆疊 (y=100 到 y=400，每層厚度 15px) -->
  <g stroke="#2b3e50" stroke-width="0.8">
    <rect x="130" y="100" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="115" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="130" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="145" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="160" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="175" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="190" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="205" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="220" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="235" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="250" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="265" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="280" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="295" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="310" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="325" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="340" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="355" width="300" height="15" fill="#ffffff"/>
    <rect x="130" y="370" width="300" height="15" fill="#bdc9d4"/>
    <rect x="130" y="385" width="300" height="15" fill="#ffffff"/>
  </g>
  <!-- 基底外框 -->
  <rect x="130" y="50" width="300" height="350" fill="none" stroke="#2b3e50" stroke-width="2"/>

  <!-- 孔洞內部剖面路徑 (挖空並覆蓋白色) -->
  <path d="M 255,48 L 255,100 C 220,145 220,225 255,270 L 273,392 C 275,398 285,398 287,392 L 305,270 C 340,225 340,145 305,100 L 305,48 Z" fill="#ffffff" stroke="#2b3e50" stroke-width="2.5"/>

  <!-- 孔口聚合物沉積 / 頸縮 (Necking) 示意 -->
  <path d="M 255,95 Q 262,100 255,108" fill="none" stroke="#2b3e50" stroke-width="4"/>
  <path d="M 305,95 Q 298,100 305,108" fill="none" stroke="#2b3e50" stroke-width="4"/>

  <!-- 電荷累積示意 -->
  <!-- 孔口電子捕獲 (負電荷) -->
  <text x="242" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3498db">-</text>
  <text x="242" y="112" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3498db">-</text>
  <text x="312" y="95" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3498db">-</text>
  <text x="312" y="112" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3498db">-</text>

  <!-- 孔底正電荷積累 (正電荷) -->
  <text x="270" y="385" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">+</text>
  <text x="282" y="385" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">+</text>

  <!-- 離子偏轉軌跡線 (紅色箭頭) -->
  <!-- 入射離子 1：受偏轉撞向側壁引發 Bowing -->
  <path d="M 270,30 L 270,120 Q 270,165 240,185" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <!-- 入射離子 2：散射離子進一步撞擊對側 -->
  <path d="M 290,30 L 290,130 Q 288,180 320,205" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
  <!-- 入射離子 3：到達深處但受底部正電阻擋減速偏折 -->
  <path d="M 280,30 L 280,260 Q 280,320 274,360" fill="none" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>

  <!-- Bowing 寬度雙向標註箭頭 -->
  <line x1="230" y1="185" x2="330" y2="185" stroke="#2b3e50" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="230" y1="180" x2="230" y2="190" stroke="#2b3e50" stroke-width="1.2"/>
  <line x1="330" y1="180" x2="330" y2="190" stroke="#2b3e50" stroke-width="1.2"/>

  <!-- 副產物向上擴散受阻示意 (藍色波浪箭頭) -->
  <path d="M 284,365 Q 289,340 284,320 T 284,285" fill="none" stroke="#3498db" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- 左側結構標註 -->
  <line x1="60" y1="75" x2="125" y2="75" stroke="#2b3e50" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <text x="55" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3e50" text-anchor="end">硬遮罩 (Hard Mask)</text>

  <line x1="60" y1="175" x2="125" y2="175" stroke="#2b3e50" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <text x="55" y="170" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b3e50" text-anchor="end">SiO₂ / Si₃N₄</text>
  <text x="55" y="190" font-family="sans-serif" font-size="14" fill="#2b3e50" text-anchor="end">多層交替堆疊</text>

  <!-- 右側物理機制說明欄 -->
  <!-- 項目 1: 電子捕獲與頸縮 -->
  <line x1="315" y1="100" x2="445" y2="85" stroke="#2b3e50" stroke-width="1.2" marker-start="url(#arrow-dark)"/>
  <text x="455" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3e50">孔口電荷分離與頸縮 (Necking)</text>
  <text x="455" y="100" font-family="sans-serif" font-size="14" fill="#2b3e50">等向性電子累積孔口；聚合物過度沉積堆積</text>

  <!-- 項目 2: 側蝕擴徑 Bowing -->
  <line x1="335" y1="185" x2="445" y2="160" stroke="#2b3e50" stroke-width="1.2" marker-start="url(#arrow-dark)"/>
  <text x="455" y="155" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3e50">頂部側蝕擴徑 (Bowing)</text>
  <text x="455" y="175" font-family="sans-serif" font-size="14" fill="#2b3e50">微角散射離子轟擊側壁，化學保護層遭破壞</text>

  <!-- 項目 3: 離子偏轉 -->
  <line x1="310" y1="230" x2="445" y2="235" stroke="#2b3e50" stroke-width="1.2" marker-start="url(#arrow-dark)"/>
  <text x="455" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3e50">離子受電荷場偏轉 (Ion Deflection)</text>
  <text x="455" y="250" font-family="sans-serif" font-size="14" fill="#2b3e50">內部局部電場導致入射軌跡偏移，引起微扭曲</text>

  <!-- 項目 4: 孔底通量衰減與正電累積 -->
  <line x1="295" y1="380" x2="445" y2="315" stroke="#2b3e50" stroke-width="1.2" marker-start="url(#arrow-dark)"/>
  <text x="455" y="310" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3e50">孔底正電荷累積與 ARDE 效應</text>
  <text x="455" y="330" font-family="sans-serif" font-size="14" fill="#2b3e50">孔底正電排斥後續離子，離子通量隨深度劇減</text>

  <!-- 項目 5: 副產物輸送受阻 -->
  <line x1="295" y1="330" x2="445" y2="390" stroke="#2b3e50" stroke-width="1.2" marker-start="url(#arrow-dark)"/>
  <text x="455" y="385" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2b3e50">反應副產物輸送受阻 (Etch Stop)</text>
  <text x="455" y="405" font-family="sans-serif" font-size="14" fill="#2b3e50">Knudsen 擴散限制，脫附產物阻礙孔底反應</text>
</svg>