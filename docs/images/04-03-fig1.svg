<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 圖表標題與分區標籤 -->
  <text x="210" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">微粒與基板雙電層結構</text>
  <text x="630" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">DLVO 總交互作用位能曲線</text>

  <!-- ==================== 左半部：微粒與基板物理模型 ==================== -->
  
  <!-- 雙電層擴散層範圍示意（微粒外圈） -->
  <circle cx="210" cy="115" r="58" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="280" y="80" font-family="sans-serif" font-size="14" fill="#3b82f6">滑動面 (Zeta 電位 ζ)</text>

  <!-- 懸浮微粒本體 -->
  <circle cx="210" cy="115" r="42" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="210" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a">污染微粒</text>

  <!-- 微粒表面負電荷 (-) -->
  <text x="210" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="245" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="257" y="120" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="245" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="210" y="166" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="175" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="163" y="120" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="175" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>

  <!-- 微粒周圍反離子 (+) -->
  <text x="210" y="52" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="265" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="278" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="142" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="155" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>

  <!-- 基板雙電層擴散層邊界 -->
  <line x1="40" y1="300" x2="380" y2="300" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="290" y="292" font-family="sans-serif" font-size="14" fill="#3b82f6">擴散雙電層重疊區</text>

  <!-- 基板反離子 (+) -->
  <text x="70" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="130" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="290" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>
  <text x="350" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">+</text>

  <!-- 矽晶圓基板本體 -->
  <rect x="40" y="340" width="340" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="210" y="376" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">矽晶圓基板 (Si Substrate)</text>

  <!-- 基板表面負電荷 (-) -->
  <text x="60" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="100" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="140" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="180" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="220" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="260" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="300" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>
  <text x="340" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444">-</text>

  <!-- 力向量標示：靜電排斥力 (相背) -->
  <line x1="180" y1="205" x2="180" y2="175" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="180" y1="235" x2="180" y2="265" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="168" y="225" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">靜電排斥力 (FEDL)</text>

  <!-- 力向量標示：凡得瓦吸引力 (相向) -->
  <line x1="240" y1="175" x2="240" y2="205" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="240" y1="265" x2="240" y2="235" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="252" y="225" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">凡得瓦吸引力 (FvdW)</text>

  <!-- 間距 D 標示 -->
  <line x1="55" y1="157" x2="55" y2="340" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="50" y1="157" x2="60" y2="157" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="50" y1="340" x2="60" y2="340" stroke="#0f172a" stroke-width="1.2"/>
  <text x="50" y="255" text-anchor="end" font-family="sans-serif" font-size="14" fill="#0f172a">距離 D</text>

  <!-- ==================== 右半部：DLVO 位能圖 ==================== -->
  
  <!-- 座標軸 -->
  <line x1="470" y1="230" x2="760" y2="230" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
  <line x1="490" y1="410" x2="490" y2="55" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
  
  <text x="760" y="260" text-anchor="end" font-family="sans-serif" font-size="14" fill="#0f172a">微粒基板間距 D</text>
  <text x="480" y="65" text-anchor="end" font-family="sans-serif" font-size="14" fill="#0f172a">位能 V</text>
  <text x="500" y="85" font-family="sans-serif" font-size="14" fill="#3b82f6">斥力 (+)</text>
  <text x="500" y="395" font-family="sans-serif" font-size="14" fill="#ef4444">引力 (-)</text>

  <!-- 凡得瓦吸引位能曲線 V_vdW (紅色虛線) -->
  <path d="M 505 400 Q 515 285 550 255 T 740 232" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="740" y="220" text-anchor="end" font-family="sans-serif" font-size="14" fill="#ef4444">VvdW (凡得瓦引力位能)</text>

  <!-- 雙電層排斥位能曲線 V_EDL (藍色虛線) -->
  <path d="M 505 90 Q 530 115 570 185 T 730 228" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="730" y="165" text-anchor="end" font-family="sans-serif" font-size="14" fill="#3b82f6">VEDL (雙電層斥力位能)</text>

  <!-- DLVO 總位能曲線 V_total (綠色實線) -->
  <path d="M 502 385 C 505 230 514 125 538 125 C 565 125 605 240 655 242 C 690 243 715 233 740 230" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <text x="590" y="115" font-family="sans-serif" font-size="15" font-weight="bold" fill="#10b981">Vtotal (DLVO 總位能)</text>

  <!-- 關鍵位能點標記 -->
  <!-- 排斥能障峰值 -->
  <circle cx="538" cy="125" r="4" fill="#10b981"/>
  <line x1="538" y1="125" x2="538" y2="85" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="545" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">淨排斥能障 (阻擋附著)</text>

  <!-- 第一極小值 -->
  <circle cx="503" cy="370" r="4" fill="#ef4444"/>
  <text x="512" y="375" font-family="sans-serif" font-size="14" fill="#ef4444">第一極小值 (不可逆附著)</text>

  <!-- 第二極小值 -->
  <circle cx="655" cy="242" r="3" fill="#0f172a"/>
  <text x="655" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">第二極小值 (弱附著)</text>

  <!-- 接合兩區的工藝意義註釋 -->
  <rect x="475" y="305" width="285" height="52" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="485" y="325" font-family="sans-serif" font-size="14" fill="#0f172a">鹼性清洗 (高 pH)：同帶強負電</text>
  <text x="485" y="345" font-family="sans-serif" font-size="14" fill="#3b82f6">|ζ| &gt; 30 mV → 能障升高，防止再附著</text>
</svg>