<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif"><defs><marker id="ar-1f2430" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ar-90a4ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker><marker id="ar-37474f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker><marker id="ar-00796b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00796b"/></marker><marker id="ar-5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="ar-c62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ar-2e7d32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="ar-e65100" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="ar-3f51b5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f51b5"/></marker><marker id="ar-6a1b9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/></marker></defs><rect x="1" y="1" width="958" height="598" rx="24" fill="#ffffff" stroke="#dfe3ec" stroke-width="2"/><path d="M1,25 a24,24 0 0 1 24,-24 h910 a24,24 0 0 1 24,24 v61 h-958 z" fill="#37474f"/><text x="40" y="56" font-size="32" font-weight="bold" fill="#ffffff">MOSFET 電場與載子控制</text><text x="920" y="56" font-size="17" fill="#ffffff" opacity="0.85" text-anchor="end">重點</text><line x1="36" y1="540" x2="924" y2="540" stroke="#e3e7ef" stroke-width="1.5"/><text x="40" y="574" font-size="15" fill="#5f6b7a">半導體製程技術｜bkhotey4.github.io/semi-knowledge</text><text x="920" y="574" font-size="15" fill="#5f6b7a" text-anchor="end">第 4 章　MOSFET 原理</text><circle cx="64" cy="142" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="150" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="100" y="150.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">MOS 電容透過閘極偏壓控制能帶彎曲，經歷累積、空乏與反轉三種狀態。</text><circle cx="64" cy="217.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="225.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="100" y="225.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">當表面電位達到基板電位兩倍時，進入強反轉狀態並形成導電通道。</text><circle cx="64" cy="292.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="300.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="100" y="300.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">臨界電壓受功函數差、氧化層電荷、基板摻雜及基板偏壓效應共同決定。</text><circle cx="64" cy="367.0" r="19" fill="#37474f" stroke="none" stroke-width="1.5"/><text x="64" y="375.0" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="100" y="375.0" font-size="25" fill="#1f2430" font-weight="normal" text-anchor="start">飽和區電流受夾止現象影響，與過驅動電壓的平方成正比。</text><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">藉由垂直電場調變表面載子濃度，實現源汲極間電流的精確開關控制。</text></svg>