<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- 箭頭定義 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-beam" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 大標題 -->
  <text x="400" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">變形光學系統倍率與成像幾何示意圖</text>

  <!-- ==================== 左側：光罩端 ==================== -->
  <text x="145" y="75" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">光罩端（Reticle）</text>

  <!-- 光罩坐標軸 -->
  <line x1="70" y1="235" x2="70" y2="105" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="70" y1="235" x2="215" y2="235" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="65" y="100" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="end">Y (掃描方向)</text>
  <text x="215" y="255" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">X</text>

  <!-- 光罩正方形圖案 (90 x 90) -->
  <rect x="95" y="125" width="90" height="90" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="175" font-family="sans-serif" font-size="15" fill="#2563eb" text-anchor="middle">正方形圖案</text>

  <!-- 光罩尺寸標記 -->
  <!-- 水平尺寸 L -->
  <line x1="95" y1="223" x2="185" y2="223" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="140" y="240" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">寬度 L</text>
  <!-- 垂直尺寸 L -->
  <line x1="193" y1="125" x2="193" y2="215" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="200" y="175" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="start">高度 L</text>

  <!-- ==================== 中央：變形光學系統 ==================== -->
  <text x="400" y="75" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">變形反射鏡組（Anamorphic Optics）</text>

  <!-- 反射鏡 M1（上凸/凹自由曲面鏡） -->
  <path d="M 320 120 Q 360 135 390 120" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="355" y="110" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">自由曲面鏡 M1</text>

  <!-- 反射鏡 M2（下凹自由曲面鏡） -->
  <path d="M 400 230 Q 430 215 470 230" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="435" y="250" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">自由曲面鏡 M2</text>

  <!-- EUV 光束傳播路徑 -->
  <path d="M 185 170 L 355 128 L 435 222 L 610 170" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-beam)"/>

  <!-- 倍率說明看板區 -->
  <rect x="275" y="280" width="250" height="135" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="305" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">非對稱縮小倍率轉換</text>

  <!-- X軸 4x 縮小標示 -->
  <line x1="295" y1="335" x2="495" y2="335" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="330" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">X 軸倍率：4× 縮小（非掃描向）</text>

  <!-- Y軸 8x 縮小標示 -->
  <line x1="295" y1="385" x2="495" y2="385" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="380" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">Y 軸倍率：8× 縮小（掃描方向）</text>

  <!-- ==================== 右側：晶圓端 ==================== -->
  <text x="665" y="75" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">晶圓端曝光結果（Wafer）</text>

  <!-- 晶圓坐標軸 -->
  <line x1="575" y1="235" x2="575" y2="105" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="235" x2="745" y2="235" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="100" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="end">Y</text>
  <text x="745" y="255" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">X</text>

  <!-- 晶圓矩形圖案 (寬度壓縮為原本1/4比例，高度壓縮為1/8比例，長寬比為2:1) -->
  <rect x="610" y="152" width="70" height="35" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="645" y="175" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">1 : 2 矩形特徵</text>

  <!-- 晶圓尺寸標記 -->
  <!-- 水平尺寸 L/4 -->
  <line x1="610" y1="200" x2="680" y2="200" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="645" y="218" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">寬度 L/4</text>
  <!-- 垂直尺寸 L/8 -->
  <line x1="688" y1="152" x2="688" y2="187" stroke="#64748b" stroke-width="1.2" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text x="696" y="174" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="start">高度 L/8</text>

  <!-- 底部物理結論說明 -->
  <text x="400" y="438" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">垂直方向提升至 8× 縮小可減小光罩側張角與主光線入射角，從而抑制光罩遮蔭效應</text>
</svg>