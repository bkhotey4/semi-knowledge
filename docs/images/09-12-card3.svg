474f" stroke-width="2.5" marker-end="url(#ar-37474f)"/><rect x="343.3333333333333" y="290" width="273.3333333333333" height="90" rx="10" fill="#eef1fb" stroke="#37474f" stroke-width="1.8" opacity="1"/><text x="480.0" y="341.3" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="middle">5. 機台切換至執行狀態</text><line x1="618.6666666666666" y1="335" x2="642.6666666666666" y2="335" stroke="#37474f" stroke-width="2.5" marker-end="url(#ar-37474f)"/><rect x="646.6666666666666" y="290" width="273.3333333333333" height="90" rx="10" fill="#eef1fb" stroke="#37474f" stroke-width="1.8" opacity="1"/><text x="783.3333333333333" y="341.3" font-size="18" fill="#1f2430" font-weight="normal" text-anchor="middle">6. MES 更新製程狀態紀錄</text><path d="M 783.3333333333333 230 V 260 H 176.66666666666666 V 288" fill="none" stroke="#37474f" stroke-width="2.5" marker-end="url(#ar-37474f)"/><rect x="36" y="462" width="888" height="58" rx="12" fill="#eef1fb" stroke="none" stroke-width="1.5" opacity="1"/><rect x="36" y="462" width="8" height="58" rx="4" fill="#37474f" stroke="none" stroke-width="1.5" opacity="1"/><text x="60" y="497" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">透過 EAP 中介協調，確保物料、配方與機台狀態之正確性與防呆。</text></svg>