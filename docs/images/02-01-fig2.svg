<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 標題 -->
  <text x="400" y="34" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">浮區長晶法（Float-Zone Method）原理示意圖</text>

  <!-- 中心對稱軸線 -->
  <line x1="270" y1="50" x2="270" y2="425" stroke="#7f8c8d" stroke-dasharray="6,4" stroke-width="1.2"/>

  <!-- 上夾具 (Chuck) -->
  <rect x="235" y="55" width="70" height="18" rx="2" fill="#2c3e50"/>
  <path d="M 215 50 C 235 44, 255 44, 275 44" fill="none" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="205" y="47" font-family="sans-serif" font-size="14" text-anchor="end" fill="#2c3e50">旋轉方向 ω₁</text>

  <!-- 多晶矽進料棒 (Feed Rod) -->
  <rect x="230" y="73" width="80" height="110" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.8"/>
  <!-- 多晶晶界裝飾紋理 -->
  <path d="M 230 105 L 255 118 L 275 95 L 310 110" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 245 145 L 270 135 L 295 155 L 310 140" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 265 118 L 270 135" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 懸浮熔融區 (Molten Zone) -->
  <!-- 熔融矽液滴幾何：表面張力形成的頸縮柱狀體 -->
  <path d="M 230 183 C 220 200, 220 215, 230 232 L 310 232 C 320 215, 320 200, 310 183 Z" fill="#e67e22" stroke="#c0392b" stroke-width="1.8"/>

  <!-- 射頻感應線圈截面 (RF Coil) -->
  <circle cx="206" cy="200" r="9" fill="#c0392b" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="206" cy="216" r="9" fill="#c0392b" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="334" cy="200" r="9" fill="#c0392b" stroke="#2c3e50" stroke-width="1.5"/>
  <circle cx="334" cy="216" r="9" fill="#c0392b" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- 單晶矽錠 (Single Crystal Ingot) -->
  <rect x="230" y="232" width="80" height="115" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.8"/>
  <!-- 單晶規則晶格象徵線 -->
  <line x1="240" y1="247" x2="300" y2="247" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="240" y1="265" x2="300" y2="265" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="240" y1="283" x2="300" y2="283" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="240" y1="301" x2="300" y2="301" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="240" y1="319" x2="300" y2="319" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="240" y1="337" x2="300" y2="337" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>

  <!-- 種晶過渡錐頸 (Seed Cone & Dash Neck) -->
  <path d="M 230 347 L 265 372 L 275 372 L 310 347 Z" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.8"/>
  <rect x="266" y="372" width="8" height="25" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- 下夾具 (Chuck) -->
  <rect x="240" y="397" width="60" height="18" rx="2" fill="#2c3e50"/>
  <path d="M 290 435 C 270 441, 250 441, 230 435" fill="none" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="300" y="440" font-family="sans-serif" font-size="14" text-anchor="start" fill="#2c3e50">反向旋轉 ω₂</text>

  <!-- 左側：加熱線圈移動箭頭 -->
  <line x1="160" y1="245" x2="160" y2="165" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="145" y="195" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#c0392b">高頻線圈</text>
  <text x="145" y="215" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#c0392b">相對向上平移</text>

  <!-- 右側說明標籤與引線 -->
  <!-- 1. 多晶進料棒 -->
  <line x1="310" y1="120" x2="440" y2="120" stroke="#2c3e50" stroke-width="1.2"/>
  <circle cx="310" cy="120" r="3" fill="#2c3e50"/>
  <text x="448" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">多晶矽進料棒（Feed Rod）</text>

  <!-- 2. 感應線圈 -->
  <line x1="344" y1="200" x2="440" y2="165" stroke="#2c3e50" stroke-width="1.2"/>
  <circle cx="344" cy="200" r="3" fill="#2c3e50"/>
  <text x="448" y="170" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">高頻射頻感應線圈（RF Coil）</text>

  <!-- 3. 懸浮熔融區 -->
  <line x1="316" y1="210" x2="440" y2="210" stroke="#2c3e50" stroke-width="1.2"/>
  <circle cx="316" cy="210" r="3" fill="#2c3e50"/>
  <text x="448" y="205" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e67e22">懸浮熔融區（Molten Zone）</text>
  <text x="448" y="225" font-family="sans-serif" font-size="14" fill="#2c3e50">靠表面張力與電磁力維持懸浮，高度約數公分</text>

  <!-- 4. 生長介面 -->
  <line x1="310" y1="232" x2="440" y2="252" stroke="#2c3e50" stroke-width="1.2"/>
  <circle cx="310" cy="232" r="3" fill="#2c3e50"/>
  <text x="448" y="256" font-family="sans-serif" font-size="15" fill="#2c3e50">固液生長介面（結晶凝固處）</text>

  <!-- 5. 單晶矽棒 -->
  <line x1="310" y1="290" x2="440" y2="290" stroke="#2c3e50" stroke-width="1.2"/>
  <circle cx="310" cy="290" r="3" fill="#2c3e50"/>
  <text x="448" y="295" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">再生長單晶矽錠（Single Crystal Ingot）</text>

  <!-- 6. 種晶 -->
  <line x1="274" y1="385" x2="440" y2="330" stroke="#2c3e50" stroke-width="1.2"/>
  <circle cx="274" cy="385" r="3" fill="#2c3e50"/>
  <text x="448" y="335" font-family="sans-serif" font-size="15" fill="#2c3e50">單晶種晶（Seed Crystal）</text>

  <!-- 重點製程特性提示框 -->
  <rect x="445" y="355" width="320" height="70" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="455" y="378" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c0392b">製程核心特徵：無坩堝接觸（Crucible-Free）</text>
  <text x="455" y="398" font-family="sans-serif" font-size="14" fill="#2c3e50">• 無石英熔解，間隙氧 [Oi] &lt; 10¹⁶ atoms/cm³</text>
  <text x="455" y="416" font-family="sans-serif" font-size="14" fill="#2c3e50">• 高電阻率（&gt; 1,000 Ω·cm），適用於高壓功率元件</text>
</svg>