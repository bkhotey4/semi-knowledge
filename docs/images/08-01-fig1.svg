<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- 封裝基板 Substrate -->
  <rect x="100" y="300" width="600" height="80" fill="#a5d6a7" stroke="#000000" stroke-width="2"/>
  <text x="400" y="355" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000000">封裝基板 (Substrate)</text>

  <!-- 底填膠 Underfill -->
  <path d="M 180 300 L 620 300 L 600 150 L 200 150 Z" fill="#fff9c4" stroke="#000000" stroke-width="1" stroke-dasharray="4"/>
  <text x="630" y="225" font-family="sans-serif" font-size="16" fill="#000000">底填膠 (Underfill)</text>
  <line x1="625" y1="220" x2="580" y2="220" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- 晶粒 Die (倒置) -->
  <rect x="200" y="70" width="400" height="80" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="150" x2="600" y2="150" stroke="#000000" stroke-width="3"/> <!-- 主動側 Active Side -->
  <text x="400" y="115" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#000000">晶粒 (Die) - 主動側朝下</text>

  <!-- 凸塊結構 Bumps (左、中、右) -->
  <!-- 中間凸塊標註用 -->
  <g transform="translate(400, 0)">
    <!-- 基板墊片 Pad -->
    <rect x="-30" y="300" width="60" height="8" fill="#000000"/>
    <!-- 焊錫帽 Solder Cap -->
    <rect x="-20" y="240" width="40" height="60" rx="10" fill="#e0e0e0" stroke="#000000" stroke-width="1.5"/>
    <!-- 銅柱 Copper Pillar -->
    <rect x="-15" y="155" width="30" height="85" fill="#000000"/>
    <!-- UBM -->
    <rect x="-20" y="150" width="40" height="5" fill="#000000"/>
  </g>

  <g transform="translate(280, 0)">
    <rect x="-30" y="300" width="60" height="8" fill="#000000"/>
    <rect x="-20" y="240" width="40" height="60" rx="10" fill="#e0e0e0" stroke="#000000" stroke-width="1.5"/>
    <rect x="-15" y="155" width="30" height="85" fill="#000000"/>
    <rect x="-20" y="150" width="40" height="5" fill="#000000"/>
  </g>

  <g transform="translate(520, 0)">
    <rect x="-30" y="300" width="60" height="8" fill="#000000"/>
    <rect x="-20" y="240" width="40" height="60" rx="10" fill="#e0e0e0" stroke="#000000" stroke-width="1.5"/>
    <rect x="-15" y="155" width="30" height="85" fill="#000000"/>
    <rect x="-20" y="150" width="40" height="5" fill="#000000"/>
  </g>

  <!-- 標籤與箭頭 -->
  <text x="170" y="155" font-family="sans-serif" font-size="14" text-anchor="end" fill="#000000">底層金屬 (UBM)</text>
  <line x1="175" y1="152" x2="255" y2="152" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>

  <text x="170" y="200" font-family="sans-serif" font-size="14" text-anchor="end" fill="#000000">銅柱 (Cu Pillar)</text>
  <line x1="175" y1="197" x2="260" y2="197" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>

  <text x="170" y="255" font-family="sans-serif" font-size="14" text-anchor="end" fill="#000000">焊錫帽 (Solder Cap)</text>
  <line x1="175" y1="252" x2="255" y2="252" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- 圖名 -->
  <text x="400" y="35" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">覆晶封裝 (Flip Chip) 斷面結構示意圖</text>
</svg>