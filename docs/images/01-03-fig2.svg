<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- 白色背景 -->
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- 圖表總標題 -->
  <text x="400" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">逆向崩潰微觀機制對比</text>

  <!-- 左側面板：齊納崩潰 -->
  <rect x="25" y="48" width="365" height="385" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="207" y="78" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">齊納崩潰（帶對帶穿隧）</text>
  <text x="207" y="100" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">重摻雜 · 極窄空乏區 · 典型崩潰電壓 &lt; 4 V</text>

  <!-- 左側：電場方向標示 -->
  <line x1="330" y1="122" x2="85" y2="122" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="207" y="117" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">接面逆向電場 ℰ</text>

  <!-- 左側：區域標籤 -->
  <text x="95" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">p⁺ 側</text>
  <text x="320" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">n⁺ 側</text>
  <line x1="145" y1="135" x2="145" y2="365" stroke="#0f172a" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="265" y1="135" x2="265" y2="365" stroke="#0f172a" stroke-dasharray="3 3" stroke-width="1"/>
  <text x="205" y="152" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">空乏區 (W &lt; 10 nm)</text>

  <!-- 左側：能帶傾斜 -->
  <!-- 導電帶 Ec -->
  <path d="M 45 160 L 145 160 C 185 160 225 285 265 285 L 370 285" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="75" y="154" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">導電帶 Ec</text>

  <!-- 價電帶 Ev -->
  <path d="M 45 235 L 145 235 C 185 235 225 360 265 360 L 370 360" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="75" y="252" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c">價電帶 Ev</text>

  <!-- 左側：穿隧位能障礙寬度標示 -->
  <line x1="145" y1="218" x2="218" y2="218" stroke="#0f172a" stroke-width="1"/>
  <line x1="145" y1="213" x2="145" y2="223" stroke="#0f172a" stroke-width="1"/>
  <line x1="218" y1="213" x2="218" y2="223" stroke="#0f172a" stroke-width="1"/>
  <text x="181" y="212" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">距離 d</text>

  <!-- 左側：穿隧電子與路徑 -->
  <circle cx="130" cy="235" r="7" fill="#1d4ed8"/>
  <text x="130" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <line x1="140" y1="235" x2="235" y2="235" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <text x="188" y="254" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">量子穿隧</text>

  <circle cx="247" cy="235" r="7" fill="#1d4ed8"/>
  <text x="247" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
  <line x1="257" y1="235" x2="295" y2="280" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 左側底部物理結語 -->
  <text x="207" y="410" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">高電場使價電帶電子直接穿隧至導電帶</text>

  <!-- 右側面板：雪崩崩潰 -->
  <rect x="410" y="48" width="365" height="385" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="592" y="78" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">雪崩崩潰（碰撞游離倍增）</text>
  <text x="592" y="100" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">中低摻雜 · 較寬空乏區 · 典型崩潰電壓 &gt; 6 V</text>

  <!-- 右側：電場方向標示 -->
  <line x1="715" y1="122" x2="470" y2="122" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="592" y="117" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">接面逆向電場 ℰ</text>

  <!-- 右側：載子圖例 -->
  <circle cx="445" cy="144" r="6" fill="#1d4ed8"/>
  <text x="445" y="149" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
  <text x="460" y="149" font-family="sans-serif" font-size="14" fill="#0f172a">電子</text>

  <circle cx="510" cy="144" r="6" fill="#b91c1c"/>
  <text x="510" y="149" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
  <text x="525" y="149" font-family="sans-serif" font-size="14" fill="#0f172a">電洞</text>

  <rect x="575" y="138" width="12" height="12" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="595" y="149" font-family="sans-serif" font-size="14" fill="#0f172a">晶格原子</text>

  <!-- 右側：雪崩游離倍增鏈 -->
  <!-- 初始電子加速 -->
  <text x="430" y="240" font-family="sans-serif" font-size="14" fill="#1d4ed8">入射電子</text>
  <circle cx="435" cy="255" r="7" fill="#1d4ed8"/>
  <text x="435" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>
  <line x1="445" y1="255" x2="495" y2="255" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 第 1 次碰撞點 -->
  <rect x="502" y="247" width="16" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="510" y="238" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">碰撞游離</text>

  <!-- 第 1 代電洞受力反向運動 -->
  <line x1="502" y1="260" x2="455" y2="295" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <circle cx="448" cy="300" r="7" fill="#b91c1c"/>
  <text x="448" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

  <!-- 第 1 代兩顆電子向前加速 -->
  <line x1="520" y1="250" x2="600" y2="198" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="260" x2="600" y2="312" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 第 2 次碰撞點 A (上方) -->
  <rect x="605" y="185" width="16" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="605" y1="190" x2="560" y2="170" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <circle cx="552" cy="166" r="7" fill="#b91c1c"/>
  <text x="552" y="171" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

  <line x1="623" y1="190" x2="710" y2="170" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <circle cx="722" cy="168" r="7" fill="#1d4ed8"/>
  <text x="722" y="173" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <line x1="623" y1="196" x2="710" y2="215" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <circle cx="722" cy="217" r="7" fill="#1d4ed8"/>
  <text x="722" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <!-- 第 2 次碰撞點 B (下方) -->
  <rect x="605" y="310" width="16" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="605" y1="322" x2="560" y2="345" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <circle cx="552" cy="349" r="7" fill="#b91c1c"/>
  <text x="552" y="354" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

  <line x1="623" y1="315" x2="710" y2="295" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <circle cx="722" cy="293" r="7" fill="#1d4ed8"/>
  <text x="722" y="298" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <line x1="623" y1="322" x2="710" y2="345" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <circle cx="722" cy="347" r="7" fill="#1d4ed8"/>
  <text x="722" y="352" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

  <!-- 右側連鎖倍增說明 -->
  <text x="740" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">倍增</text>
  <text x="740" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">電流</text>

  <!-- 右側底部物理結語 -->
  <text x="592" y="410" font-family="sans-serif" font-size="14" fill="#0f172a" text-anchor="middle">高動能載子碰撞晶格引發雪崩倍增反應</text>
</svg>